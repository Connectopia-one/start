<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tijdlijn leggen</title>
<!--
  Tijdlijn leggen — een prikkelarm spel van Connectopia (Kim, 9 november 2026).

  Kaartjes met gebeurtenissen staan door elkaar. Het kind zet ze met de
  pijltjes in de juiste volgorde, van vroeger naar nu, en drukt op "Kijk na".
  Dan verschijnen de jaartallen en zie je rustig welke kaartjes al goed
  staan. Geen klok, geen geluid, geen punten, geen slepen nodig.

  Een reeks bijzetten: zet een blokje bij in REEKSEN. jaar is een getal om op
  te sorteren (voor Christus negatief), tekst is wat er na het nakijken bij
  staat. Jaartallen nagekeken met gewone naslagwerken (Wikipedia NL).
-->
<style>
  :root { --bg:#fbf6ea; --kaart:#fffdf7; --ink:#2f3a2a; --zacht:#6b7363; --groen:#2f4a22;
    --groen-licht:#e3ead9; --rand:#e4dcc8; --tip:#f3ecd8; --nog:#f1e6d0; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:18px; line-height:1.6; }
  main { max-width:820px; margin:0 auto; padding:22px 18px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; color:var(--groen); }
  p { margin:0 0 10px; }
  .zacht { color:var(--zacht); }
  .rij { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { font:inherit; color:var(--ink); background:var(--kaart); border:2px solid var(--rand);
    border-radius:14px; padding:10px 18px; cursor:pointer; }
  button:hover { border-color:var(--groen); }
  button:focus-visible { outline:3px solid var(--groen); outline-offset:2px; }
  button.hoofd { background:var(--groen); color:#fff; border-color:var(--groen); font-weight:700; }
  button:disabled { opacity:.35; cursor:default; }
  .blok { background:var(--kaart); border:1px solid var(--rand); border-radius:20px; padding:18px; margin-top:16px; }
  .label { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--zacht); font-weight:700; margin-bottom:6px; }
  ol.lijn { list-style:none; margin:0; padding:0 0 0 22px; border-left:4px solid var(--rand); display:flex; flex-direction:column; gap:10px; }
  ol.lijn li { position:relative; display:flex; gap:12px; align-items:center; background:var(--kaart);
    border:2px solid var(--rand); border-radius:14px; padding:10px 12px; }
  ol.lijn li::before { content:""; position:absolute; left:-33px; top:50%; width:14px; height:14px; margin-top:-7px;
    border-radius:50%; background:var(--rand); }
  ol.lijn li.goed { background:var(--groen-licht); border-color:#a9bf92; }
  ol.lijn li.goed::before { background:var(--groen); }
  ol.lijn li.nog { background:var(--nog); }
  .tekst { flex:1; }
  .jaar { display:block; font-size:.9rem; color:var(--groen); font-weight:700; }
  .pijlen { display:flex; flex-direction:column; gap:4px; }
  .pijlen button { padding:2px 12px; font-size:1rem; line-height:1.3; }
  .bericht { margin-top:14px; padding:12px 16px; border-radius:14px; background:var(--tip); }
  .bericht:empty { display:none; }
  footer { margin-top:28px; font-size:.85rem; color:var(--zacht); }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const REEKSEN = {
  periodes: { titel: "De grote periodes", uitleg: "5 kaartjes, om mee te beginnen", kaartjes: [
    { tekst: "Prehistorie", jaar: -10000, toon: "tot ongeveer 3000 voor Christus" },
    { tekst: "Oudheid", jaar: -3000, toon: "van ongeveer 3000 voor Christus tot 500 na Christus" },
    { tekst: "Middeleeuwen", jaar: 500, toon: "van ongeveer 500 tot 1500" },
    { tekst: "Nieuwe Tijd", jaar: 1500, toon: "van ongeveer 1500 tot 1800" },
    { tekst: "Nieuwste Tijd", jaar: 1800, toon: "van ongeveer 1800 tot nu" },
  ]},
  oudheid: { titel: "De oudheid", uitleg: "Egypte, Griekenland en Rome", kaartjes: [
    { tekst: "De piramides van Gizeh worden gebouwd", jaar: -2560, toon: "ongeveer 2560 voor Christus" },
    { tekst: "De eerste Olympische Spelen in Griekenland", jaar: -776, toon: "776 voor Christus" },
    { tekst: "Rome wordt gesticht, volgens de legende", jaar: -753, toon: "753 voor Christus" },
    { tekst: "Alexander de Grote sterft", jaar: -323, toon: "323 voor Christus" },
    { tekst: "Julius Caesar wordt vermoord", jaar: -44, toon: "44 voor Christus" },
    { tekst: "Het West-Romeinse Rijk valt", jaar: 476, toon: "476 na Christus" },
  ]},
  belgie: { titel: "Uit de geschiedenis van ons land", uitleg: "van de Romeinen tot het Atomium", kaartjes: [
    { tekst: "Julius Caesar verovert onze streken", jaar: -57, toon: "57 voor Christus" },
    { tekst: "Karel de Grote wordt tot keizer gekroond", jaar: 800, toon: "800" },
    { tekst: "De Guldensporenslag bij Kortrijk", jaar: 1302, toon: "1302" },
    { tekst: "Keizer Karel wordt geboren in Gent", jaar: 1500, toon: "1500" },
    { tekst: "België wordt onafhankelijk", jaar: 1830, toon: "1830" },
    { tekst: "De Eerste Wereldoorlog begint", jaar: 1914, toon: "1914" },
    { tekst: "De Tweede Wereldoorlog eindigt", jaar: 1945, toon: "1945" },
    { tekst: "Het Atomium wordt gebouwd voor de Wereldtentoonstelling", jaar: 1958, toon: "1958" },
  ]},
  uitvindingen: { titel: "Uitvindingen", uitleg: "van het wiel tot de smartphone", kaartjes: [
    { tekst: "Het wiel", jaar: -3500, toon: "ongeveer 3500 voor Christus" },
    { tekst: "Het schrift", jaar: -3200, toon: "ongeveer 3200 voor Christus" },
    { tekst: "De boekdrukkunst van Gutenberg", jaar: 1450, toon: "ongeveer 1450" },
    { tekst: "De verbeterde stoommachine van James Watt", jaar: 1769, toon: "1769" },
    { tekst: "De telefoon", jaar: 1876, toon: "1876" },
    { tekst: "De eerste vlucht met een vliegtuig, door de gebroeders Wright", jaar: 1903, toon: "1903" },
    { tekst: "Het world wide web", jaar: 1991, toon: "1991" },
    { tekst: "De eerste iPhone", jaar: 2007, toon: "2007" },
  ]},
};

const $app = document.getElementById("app");
const schud = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function start() {
  $app.innerHTML = `
    <h1>Tijdlijn leggen</h1>
    <p class="zacht">Zet de kaartjes in de juiste volgorde, van vroeger naar nu. Gebruik de pijltjes. Geen klok, neem je tijd.</p>
    <div class="blok">
      <div class="label">Kies een reeks</div>
      <div class="rij">${Object.entries(REEKSEN).map(([k, v]) =>
        `<button class="hoofd" data-r="${k}">${v.titel}<br><small style="font-weight:400">${v.uitleg}</small></button>`).join("")}</div>
    </div>
    <footer>Een spel van Connectopia vzw. Er wordt niets bewaard.</footer>`;
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => speel(b.dataset.r));
}

function speel(sleutel) {
  const reeks = REEKSEN[sleutel];
  const juist = reeks.kaartjes.slice().sort((a, b) => a.jaar - b.jaar);
  let volgorde;
  do { volgorde = schud(reeks.kaartjes); } while (volgorde.every((k, i) => k === juist[i]));
  let nagekeken = false, bericht = "";

  function teken(focusIndex, focusRichting) {
    const allesGoed = nagekeken && volgorde.every((k, i) => k === juist[i]);
    $app.innerHTML = `
      <div class="rij" style="justify-content:space-between">
        <div><h1>${reeks.titel}</h1><div class="zacht" style="font-size:.9rem">Bovenaan het oudste, onderaan het jongste</div></div>
        <button data-terug>Andere reeks kiezen</button>
      </div>
      <div class="blok">
        <div class="label">Vroeger</div>
        <ol class="lijn">${volgorde.map((k, i) => `
          <li class="${nagekeken ? (k === juist[i] ? "goed" : "nog") : ""}">
            <span class="tekst">${esc(k.tekst)}${nagekeken && k === juist[i] ? `<span class="jaar">${esc(k.toon)}</span>` : ""}</span>
            ${allesGoed ? "" : `<span class="pijlen">
              <button data-op="${i}" aria-label="${esc(k.tekst)} hoger zetten" ${i === 0 ? "disabled" : ""}>▲</button>
              <button data-neer="${i}" aria-label="${esc(k.tekst)} lager zetten" ${i === volgorde.length - 1 ? "disabled" : ""}>▼</button>
            </span>`}
          </li>`).join("")}</ol>
        <div class="label" style="margin-top:8px">Nu</div>
        <div class="bericht" aria-live="polite">${bericht}</div>
        <div class="rij" style="justify-content:flex-end;margin-top:12px">
          ${allesGoed ? `<button data-terug2>Andere reeks kiezen</button><button class="hoofd" data-opnieuw>Nog eens</button>`
                      : `<button class="hoofd" data-kijk>Kijk na</button>`}
        </div>
      </div>
      <footer>Een spel van Connectopia vzw.</footer>`;
    $app.querySelector("[data-terug]").onclick = start;
    const t2 = $app.querySelector("[data-terug2]"); if (t2) t2.onclick = start;
    const o = $app.querySelector("[data-opnieuw]"); if (o) o.onclick = () => speel(sleutel);
    const wissel = (i, j, r) => { [volgorde[i], volgorde[j]] = [volgorde[j], volgorde[i]]; nagekeken = false; bericht = ""; teken(j, r); };
    $app.querySelectorAll("[data-op]").forEach(b => b.onclick = () => { const i = +b.dataset.op; wissel(i, i - 1, "op"); });
    $app.querySelectorAll("[data-neer]").forEach(b => b.onclick = () => { const i = +b.dataset.neer; wissel(i, i + 1, "neer"); });
    const kijk = $app.querySelector("[data-kijk]");
    if (kijk) kijk.onclick = () => {
      nagekeken = true;
      const goed = volgorde.filter((k, i) => k === juist[i]).length;
      bericht = goed === volgorde.length
        ? "Alles staat goed. Mooi gedaan! Bij elk kaartje staat nu wanneer het was."
        : goed === 0 ? "Nog geen enkel kaartje staat op zijn plaats. Begin bij het oudste: welk kaartje hoort helemaal bovenaan?"
        : `${goed} van de ${volgorde.length} kaartjes staan al op hun plaats. Die zijn groen en tonen hun jaartal. Verschuif de andere nog eens en kijk opnieuw na.`;
      teken();
    };
    if (focusIndex !== undefined) {
      const b = $app.querySelector(`[data-${focusRichting}="${focusIndex}"]`) || $app.querySelector(`[data-op="${focusIndex}"],[data-neer="${focusIndex}"]`);
      if (b && !b.disabled) b.focus();
    }
  }
  teken();
}
start();
</script>
</body>
</html>
