<title>Kaartpuzzel</title>
<!--
  Kaartpuzzel — een prikkelarm spel van Connectopia (Kim, 9 november 2026).

  Je krijgt een naam en tikt op de lege kaart aan waar die provincie of dat
  land ligt. Geen klok, geen geluid, geen punten. Wie juist tikt, ziet het
  gebied rustig ingekleurd met de naam erbij. Wie mis tikt, krijgt te horen
  welk gebied dat was en in welke richting het gezochte gebied ligt.

  Bron van de kaarten: Natural Earth (naturalearthdata.com), vrij te
  gebruiken (publiek domein). Provincies: admin-1 1:10m, landen: admin-0 1:50m.
  De lijnen zijn vereenvoudigd met scripts in de werkmap van Claude.
-->
<style>
  :root { --bg:#fbf6ea; --kaart:#fffdf7; --ink:#2f3a2a; --zacht:#6b7363; --groen:#2f4a22;
    --groen-licht:#e3ead9; --rand:#e4dcc8; --land:#f1e8d4; --grens:#c9b48c; --anders:#e9e4d8;
    --goed:#c9dbb4; --zee:#eef2ee; --tip:#f3ecd8; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:18px; line-height:1.6; }
  main { max-width:900px; margin:0 auto; padding:22px 18px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; color:var(--groen); }
  p { margin:0 0 10px; }
  .zacht { color:var(--zacht); }
  .rij { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { font:inherit; color:var(--ink); background:var(--kaart); border:2px solid var(--rand);
    border-radius:14px; padding:10px 18px; cursor:pointer; }
  button:hover { border-color:var(--groen); }
  button:focus-visible { outline:3px solid var(--groen); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--groen-licht); border-color:var(--groen); font-weight:700; }
  button.hoofd { background:var(--groen); color:#fff; border-color:var(--groen); font-weight:700; }
  .blok { background:var(--kaart); border:1px solid var(--rand); border-radius:20px; padding:18px; margin-top:16px; }
  .label { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--zacht); font-weight:700; margin-bottom:6px; }
  .vraag { font-size:1.3rem; font-weight:700; text-align:center; margin:4px 0 10px; }
  svg.kaart { width:100%; height:auto; background:var(--zee); border-radius:14px; display:block; touch-action:manipulation; }
  .gebied { fill:var(--anders); stroke:var(--grens); stroke-width:.8; }
  .gebied.speel { fill:var(--land); cursor:pointer; }
  .gebied.speel:hover { fill:#ebdfc4; }
  .gebied.klaar { fill:var(--goed); cursor:default; }
  .gebied.toon { fill:#e6d3ae; }
  .naam { font-size:11px; fill:var(--groen); font-weight:700; pointer-events:none; text-anchor:middle;
    paint-order:stroke; stroke:#fffdf7; stroke-width:3px; }
  .bericht { margin-top:12px; padding:12px 16px; border-radius:14px; background:var(--tip); }
  .bericht:empty { display:none; }
  .teller { font-size:.9rem; color:var(--zacht); }
  footer { margin-top:28px; font-size:.85rem; color:var(--zacht); }
</style>
</head>

const SETS = {
  belgie: { titel: "De provincies van België", uitleg: "10 provincies en Brussel", vraag: "Waar ligt" },
  europa: { titel: "Landen van Europa", uitleg: "19 landen, van onze buren tot Scandinavië", vraag: "Waar ligt" },
};
const $app = document.getElementById("app");
const schud = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function start() {
  $app.innerHTML = `
    <h1>Kaartpuzzel</h1>
    <p class="zacht">Zoek de plaats op de lege kaart. Geen klok, geen punten. Neem je tijd.</p>
    <div class="blok">
      <div class="label">Kies een kaart</div>
      <div class="rij">${Object.entries(SETS).map(([k, v]) =>
        `<button class="hoofd" data-set="${k}">${v.titel}<br><small style="font-weight:400">${v.uitleg}</small></button>`).join("")}</div>
    </div>
    <footer>Een spel van Connectopia vzw. Kaarten: Natural Earth (publiek domein). Er wordt niets bewaard.</footer>`;
  $app.querySelectorAll("[data-set]").forEach(b => b.onclick = () => speel(b.dataset.set));
}

function richting(van, naar) {
  const dx = naar.cx - van.cx, dy = naar.cy - van.cy;
  const ns = dy < -Math.abs(dx) * .5 ? "noorden" : dy > Math.abs(dx) * .5 ? "zuiden" : "";
  const ow = dx > Math.abs(dy) * .5 ? "oosten" : dx < -Math.abs(dy) * .5 ? "westen" : "";
  if (ns && ow) return `meer naar het ${ns === "noorden" ? "noord" : "zuid"}${ow}`;
  return `meer naar het ${ns || ow}`;
}

function speel(sleutel) {
  const set = SETS[sleutel], kaart = KAARTEN[sleutel];
  const speelbaar = kaart.gebieden.filter(g => g.speel);
  let rest = schud(speelbaar.map(g => g.naam));
  const klaar = new Set();
  let bericht = "";

  function teken() {
    const doel = rest[0];
    const paden = kaart.gebieden.map((g, i) =>
      `<path d="${g.d}" data-i="${i}" class="gebied ${g.speel ? "speel" : ""} ${klaar.has(g.naam) ? "klaar" : ""}"
        ${g.speel && !klaar.has(g.naam) ? `role="button" tabindex="0" aria-label="een gebied op de kaart"` : ""}/>`).join("");
    const namen = kaart.gebieden.filter(g => klaar.has(g.naam)).map(g =>
      `<text class="naam" x="${g.cx}" y="${g.cy}">${esc(g.naam)}</text>`).join("");
    $app.innerHTML = `
      <div class="rij" style="justify-content:space-between">
        <div><h1>${set.titel}</h1><div class="teller">${klaar.size} van ${speelbaar.length} gevonden</div></div>
        <button data-terug>Andere kaart kiezen</button>
      </div>
      <div class="blok">
        ${doel ? `<div class="vraag">${set.vraag} <span style="color:var(--groen)">${esc(doel)}</span>?</div>`
               : `<div class="vraag">Klaar! Je vond ze allemaal.</div>`}
        <svg class="kaart" viewBox="0 0 ${kaart.b} ${kaart.h}" role="img" aria-label="Kaart: ${set.titel}">${paden}${namen}</svg>
        <div class="bericht" aria-live="polite">${bericht}</div>
        <div class="rij" style="justify-content:space-between;margin-top:12px">
          ${doel ? `<button data-toon>Toon me waar</button><button data-sla>Sla over, later nog eens</button>`
                 : `<button class="hoofd" data-opnieuw>Nog eens</button>`}
        </div>
      </div>
      <footer>Kaarten: Natural Earth (publiek domein).</footer>`;
    $app.querySelector("[data-terug]").onclick = start;
    const o = $app.querySelector("[data-opnieuw]"); if (o) o.onclick = () => speel(sleutel);
    const sla = $app.querySelector("[data-sla]"); if (sla) sla.onclick = () => { rest.push(rest.shift()); bericht = ""; teken(); };
    const toon = $app.querySelector("[data-toon]"); if (toon) toon.onclick = () => {
      const i = kaart.gebieden.findIndex(g => g.naam === doel);
      $app.querySelector(`[data-i="${i}"]`).classList.add("toon");
      $app.querySelector(".bericht").textContent = `${doel} is nu iets donkerder gekleurd. Tik het aan.`;
    };
    $app.querySelectorAll("path.speel").forEach(p => {
      const g = kaart.gebieden[+p.dataset.i];
      if (klaar.has(g.naam)) return;
      const tik = () => {
        if (g.naam === doel) { klaar.add(doel); rest.shift(); bericht = `Juist, dat is ${esc(doel)}.`; }
        else {
          const d = kaart.gebieden.find(x => x.naam === doel);
          bericht = `Dat is ${esc(g.naam)}. ${esc(doel)} ligt ${richting(g, d)}.`;
        }
        teken();
      };
      p.addEventListener("click", tik);
      p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tik(); } });
    });
  }
  teken();
}
start();
