<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foutenspeurder</title>
<!--
  Foutenspeurder — een prikkelarm spel van Connectopia (Kim, 9 november 2026).

  Een berekening staat in stappen onder elkaar. Eén stap is fout. Het kind
  tikt de foute stap aan en leest daarna rustig waarom het fout is en hoe het
  wel moet. Geen klok, geen geluid, geen punten.

  De fouten bij breuken en procenten zijn de denkfouten van onze
  denkfoutenbladen, die gebaseerd zijn op het idee van de gratis werkbladen
  van Munan (munan.nl/gratis-werkbladen-groep-8). De oefeningen zelf zijn
  nieuw geschreven door Connectopia.

  Een oefening bijzetten: zet een blokje bij in OEFENINGEN. stappen[0] is de
  opgave (niet aan te tikken), fout is het nummer van de foute stap.
-->
<style>
  :root { --bg:#fbf6ea; --kaart:#fffdf7; --ink:#2f3a2a; --zacht:#6b7363; --groen:#2f4a22;
    --groen-licht:#e3ead9; --rand:#e4dcc8; --tip:#f3ecd8; --fout:#f1dcc4; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:18px; line-height:1.6; }
  main { max-width:820px; margin:0 auto; padding:22px 18px 40px; }
  h1 { font-size:1.6rem; margin:0 0 4px; color:var(--groen); }
  p { margin:0 0 10px; }
  .zacht { color:var(--zacht); }
  .rij { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { font:inherit; color:var(--ink); background:var(--kaart); border:2px solid var(--rand);
    border-radius:14px; padding:10px 18px; cursor:pointer; text-align:left; }
  button:hover { border-color:var(--groen); }
  button:focus-visible { outline:3px solid var(--groen); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--groen-licht); border-color:var(--groen); font-weight:700; }
  button.hoofd { background:var(--groen); color:#fff; border-color:var(--groen); font-weight:700; }
  button:disabled { cursor:default; }
  .blok { background:var(--kaart); border:1px solid var(--rand); border-radius:20px; padding:18px; margin-top:16px; }
  .label { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--zacht); font-weight:700; margin-bottom:6px; }
  .opgave { font-size:1.35rem; font-weight:700; margin:4px 0 12px; }
  .stappen { display:flex; flex-direction:column; gap:10px; }
  .stap { font-size:1.25rem; width:100%; font-variant-numeric:tabular-nums; }
  .stap.gevonden { background:var(--fout); border-color:#c9a77f; }
  .stap.klopt { color:var(--zacht); }
  .bericht { margin-top:14px; padding:12px 16px; border-radius:14px; background:var(--tip); }
  .bericht:empty { display:none; }
  .teller { font-size:.9rem; color:var(--zacht); }
  footer { margin-top:28px; font-size:.85rem; color:var(--zacht); }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const OEFENINGEN = [
  { groep: "breuken", stappen: ["1/4 + 2/4", "= (1 + 2) / (4 + 4)", "= 3/8"], fout: 1,
    uitleg: "De noemers mag je niet optellen. De stukken blijven even groot: vierden. Je telt enkel de tellers op: 1/4 + 2/4 = 3/4." },
  { groep: "breuken", stappen: ["1/2 + 1/3", "= (1 + 1) / (2 + 3)", "= 2/5"], fout: 1,
    uitleg: "Je kan enkel stukken optellen die even groot zijn. Maak eerst gelijknamig: 1/2 = 3/6 en 1/3 = 2/6. Dan is 3/6 + 2/6 = 5/6." },
  { groep: "breuken", stappen: ["3/4 − 1/2", "= 3/4 − 2/4", "= 1/2"], fout: 2,
    uitleg: "De eerste stap is juist: 1/2 = 2/4. Daarna trek je enkel de tellers af en blijft de noemer 4: 3/4 − 2/4 = 1/4." },
  { groep: "breuken", stappen: ["2/3 van 12", "= 12 : 2 × 3", "= 18"], fout: 1,
    uitleg: "Je deelt eerst door de noemer en vermenigvuldigt dan met de teller: 12 : 3 = 4, en 4 × 2 = 8. Een deel van 12 kan nooit meer zijn dan 12." },
  { groep: "breuken", stappen: ["Welke is groter: 1/3 of 1/5?", "5 is groter dan 3", "dus 1/5 is groter dan 1/3"], fout: 2,
    uitleg: "Het klopt dat 5 groter is dan 3, maar hoe meer stukken, hoe kleiner elk stuk. Een taart in 3 stukken geeft grotere stukken dan in 5. Dus 1/3 is groter." },
  { groep: "breuken", stappen: ["6/8 vereenvoudigen", "teller: 6 : 2 = 3", "noemer: 8 : 4 = 2", "= 3/2"], fout: 2,
    uitleg: "Teller en noemer deel je door hetzelfde getal. 6 : 2 = 3 en 8 : 2 = 4, dus 6/8 = 3/4." },
  { groep: "procenten", stappen: ["20% van 50", "= 50 : 20", "= 2,5"], fout: 1,
    uitleg: "20% betekent 20 honderdsten. Deel door 100 en vermenigvuldig met 20: 50 : 100 × 20 = 10." },
  { groep: "procenten", stappen: ["Een spel kost 40 euro. Je krijgt 25% korting. Hoeveel betaal je?", "25% van 40 = 10", "Je betaalt 10 euro"], fout: 2,
    uitleg: "De berekening is juist, maar 10 euro is de korting. Die trek je nog af van de prijs: 40 − 10 = 30 euro." },
  { groep: "procenten", stappen: ["50% van 30", "= de helft van 30", "= 50"], fout: 2,
    uitleg: "50% is de helft. De helft van 30 is 15. Het antwoord kan niet groter zijn dan 30." },
  { groep: "procenten", stappen: ["10% van 80", "= 80 : 100 × 10", "= 80"], fout: 2,
    uitleg: "80 : 100 = 0,8 en 0,8 × 10 = 8. Korter: 10% is één tiende, en 80 : 10 = 8." },
  { groep: "rekenen", stappen: ["3 + 4 × 2", "= 7 × 2", "= 14"], fout: 1,
    uitleg: "Eerst maal en gedeeld door, daarna plus en min: 4 × 2 = 8, en 3 + 8 = 11." },
  { groep: "rekenen", stappen: ["2,5 × 10", "= 2,50"], fout: 1,
    uitleg: "Een 0 achter de komma zetten verandert niets: 2,50 is nog altijd 2,5. Bij × 10 schuift de komma één plaats naar rechts: 2,5 × 10 = 25." },
  { groep: "rekenen", stappen: ["4,7 + 2,35", "= 4,70 + 2,35", "= 6,05"], fout: 2,
    uitleg: "De eerste stap is slim. Tel dan de honderdsten: 70 + 35 = 105 honderdsten, dat is 1,05. 4 + 2 + 1,05 = 7,05." },
  { groep: "rekenen", stappen: ["600 : 30", "= 600 : 3 : 10", "= 2000"], fout: 2,
    uitleg: "De eerste stap is juist. 600 : 3 = 200, en dan nog : 10 geeft 20." },
  { groep: "rekenen", stappen: ["2,5 km in meter", "1 km = 100 m", "2,5 km = 250 m"], fout: 1,
    uitleg: "1 km = 1000 m. Dus 2,5 km = 2500 m." },
  { groep: "rekenen", stappen: ["Van 9.45 u tot 10.20 u", "10.20 − 9.45 = 75", "Het duurt 75 minuten"], fout: 1,
    uitleg: "Een uur heeft 60 minuten, geen 100. Reken in stukjes: van 9.45 u tot 10.00 u is 15 minuten, en tot 10.20 u nog 20. Samen 35 minuten." },
  { groep: "rekenen", stappen: ["Omtrek van een rechthoek van 5 cm op 3 cm", "= 5 × 3", "= 15 cm"], fout: 1,
    uitleg: "De omtrek is de rand rondom: 5 + 3 + 5 + 3 = 16 cm. Met 5 × 3 reken je de oppervlakte uit: 15 cm²." },
];
const GROEPEN = { alles: "Alles door elkaar", breuken: "Breuken", procenten: "Procenten", rekenen: "Rekenen en meten" };

const $app = document.getElementById("app");
const schud = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function start() {
  $app.innerHTML = `
    <h1>Foutenspeurder</h1>
    <p class="zacht">In elke berekening staat één foute stap. Kan jij hem vinden? Geen klok, neem je tijd.</p>
    <div class="blok">
      <div class="label">Kies waarmee je oefent</div>
      <div class="rij">${Object.entries(GROEPEN).map(([k, v]) => `<button class="hoofd" data-g="${k}">${v}</button>`).join("")}</div>
    </div>
    <footer>Een spel van Connectopia vzw. De denkfouten komen uit onze denkfoutenbladen, gebaseerd op het idee van de gratis werkbladen van Munan (munan.nl). Er wordt niets bewaard.</footer>`;
  $app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => speel(b.dataset.g));
}

function speel(groep) {
  const reeks = schud(OEFENINGEN.filter(o => groep === "alles" || o.groep === groep));
  let i = 0, gevonden = 0;
  function ronde() {
    if (i >= reeks.length) {
      $app.innerHTML = `<h1>Foutenspeurder</h1>
        <div class="blok"><p class="opgave">Klaar! Je bekeek alle ${reeks.length} berekeningen.</p>
        <div class="rij"><button class="hoofd" data-opnieuw>Nog eens</button><button data-terug>Iets anders kiezen</button></div></div>`;
      $app.querySelector("[data-opnieuw]").onclick = () => speel(groep);
      $app.querySelector("[data-terug]").onclick = start;
      return;
    }
    const o = reeks[i];
    $app.innerHTML = `
      <div class="rij" style="justify-content:space-between">
        <div><h1>Foutenspeurder</h1><div class="teller">${GROEPEN[groep]} · berekening ${i + 1} van ${reeks.length}</div></div>
        <button data-terug>Iets anders kiezen</button>
      </div>
      <div class="blok">
        <div class="label">De opgave</div>
        <div class="opgave">${esc(o.stappen[0])}</div>
        <div class="label">Tik de stap aan die fout is</div>
        <div class="stappen">${o.stappen.slice(1).map((s, k) => `<button class="stap" data-k="${k + 1}">${esc(s)}</button>`).join("")}</div>
        <div class="bericht" aria-live="polite"></div>
        <div class="rij" style="justify-content:flex-end;margin-top:12px"><button class="hoofd" data-volgende hidden>Volgende berekening</button></div>
      </div>`;
    $app.querySelector("[data-terug]").onclick = start;
    const $b = $app.querySelector(".bericht"), $v = $app.querySelector("[data-volgende]");
    $app.querySelectorAll("[data-k]").forEach(knop => knop.onclick = () => {
      if (+knop.dataset.k === o.fout) {
        gevonden++;
        knop.classList.add("gevonden");
        $app.querySelectorAll("[data-k]").forEach(k => k.disabled = true);
        $b.innerHTML = `<b>Gevonden.</b> ${esc(o.uitleg)}`;
        $v.hidden = false; $v.focus();
      } else {
        knop.classList.add("klopt"); knop.disabled = true;
        $b.textContent = "Deze stap klopt. Kijk nog eens rustig naar de andere stappen.";
      }
    });
    $v.onclick = () => { i++; ronde(); };
  }
  ronde();
}
start();
</script>
</body>
</html>
