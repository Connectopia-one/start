<style>
/* Layout: één scherm voor het digibord. Menu (niveau → hoofdstuk → spel) en een speelvlak met vaste scorebalk bovenaan. */
:root {
  --bg: #eceee9;
  --surface: #ffffff;
  --sunk: #e1e4de;
  --ink: #1d2330;
  --muted: #586070;
  --line: #cfd4cc;
  --oker: #a8650f;
  --oker-soft: #f3e3c7;
  --lapis: #274a8c;
  --lapis-soft: #dbe4f5;
  --ok: #23774a;
  --ok-soft: #d6efe0;
  --bad: #b23a33;
  --bad-soft: #f6dcd9;
  --t1: #274a8c; --t2: #a8650f; --t3: #7a3f99; --t4: #1f7a6a;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1c222c; --sunk: #252c38; --ink: #ecebe6; --muted: #a2a9b6; --line: #333b49;
    --oker: #e6a54f; --oker-soft: #3b2f1c; --lapis: #94b3ef; --lapis-soft: #22304b;
    --ok: #63c98f; --ok-soft: #1c3a2a; --bad: #f08a80; --bad-soft: #43231f;
    --t1: #94b3ef; --t2: #e6a54f; --t3: #c99be3; --t4: #6fd1bd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1c222c; --sunk: #252c38; --ink: #ecebe6; --muted: #a2a9b6; --line: #333b49;
  --oker: #e6a54f; --oker-soft: #3b2f1c; --lapis: #94b3ef; --lapis-soft: #22304b;
  --ok: #63c98f; --ok-soft: #1c3a2a; --bad: #f08a80; --bad-soft: #43231f;
  --t1: #94b3ef; --t2: #e6a54f; --t3: #c99be3; --t4: #6fd1bd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--oker); outline-offset: 2px; }
.label { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; }
.brand h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.05; }
.brand h1 span { color: var(--oker); }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 9px 16px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

/* chapters */
.chapters { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.chip small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--lapis); background: var(--lapis-soft); }

/* game cards */
.games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .games { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .games { grid-template-columns: 1fr; } }
.game-card { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 18px 18px 16px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 14px; align-items: start; transition: transform .12s, border-color .12s; }
.game-card:hover { border-color: var(--oker); transform: translateY(-2px); }
.game-card svg { grid-row: span 2; width: 56px; height: 56px; }
.game-card h3 { font-size: 1.3rem; }
.game-card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.ic-a { fill: var(--oker); } .ic-b { fill: var(--lapis); } .ic-s { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; } .ic-bg { fill: var(--sunk); }

/* teams */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.team-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.team-input { display: flex; align-items: center; gap: 8px; background: var(--sunk); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.team-input i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.team-input input { border: 0; background: transparent; font: inherit; font-weight: 700; width: 9.5em; min-width: 0; color: var(--ink); }
.linkbtn { border: 0; background: none; color: var(--lapis); font-weight: 700; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }

/* game screen */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--line); }
.bar .where { display: flex; flex-direction: column; min-width: 0; }
.bar .where strong { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; line-height: 1.1; }
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 10px 18px; font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.oker { background: var(--oker); border-color: var(--oker); color: var(--bg); }
.btn.ghost { border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.scores { display: flex; flex-wrap: wrap; gap: 8px; }
.score { display: flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 4px 6px 4px 12px; font-weight: 700; }
.score .n { font-family: var(--font-display); font-size: 1.4rem; min-width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.score.turn { border-color: var(--tc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 30%, transparent); }
.score .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); }
.score .pm { border: 0; background: var(--sunk); border-radius: 8px; width: 28px; height: 28px; font-weight: 700; }
.stage { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.turnline { font-weight: 700; color: var(--muted); }
.turnline b { color: var(--tc, var(--ink)); }
.prompt { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 3vw, 34px); font-size: clamp(1.3rem, 2.8vw, 2.1rem); line-height: 1.3; font-family: var(--font-display); text-wrap: balance; min-height: 4.5em; display: flex; align-items: center; }
.prompt.term { justify-content: center; text-align: center; font-size: clamp(2rem, 5.5vw, 3.8rem); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .options { grid-template-columns: 1fr; } }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px 18px; text-align: left; font-size: clamp(1.05rem, 2vw, 1.4rem); font-weight: 700; display: flex; gap: 14px; align-items: center; min-width: 0; }
.opt .k { flex: none; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-size: .85em; }
.opt.long { font-weight: 400; font-size: clamp(0.98rem, 1.6vw, 1.15rem); }
.opt:hover:not(:disabled) { border-color: var(--lapis); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { font-size: 1.15rem; font-weight: 700; min-height: 1.5em; }
.feedback.good { color: var(--ok); } .feedback.badc { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }

/* memory */
.mem { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mcard { position: relative; border: 2px solid var(--line); border-radius: 12px; min-height: 120px; padding: 10px; background: var(--lapis); color: var(--bg); display: grid; place-items: center; text-align: center; font-weight: 700; overflow-wrap: anywhere; }
.mcard .back { font-family: var(--font-display); font-size: 2rem; opacity: .55; }
.mcard.open { background: var(--surface); color: var(--ink); }
.mcard.open.w { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.05rem, 2vw, 1.5rem); }
.mcard.open.d { font-weight: 400; font-size: clamp(.8rem, 1.3vw, 1rem); background: var(--oker-soft); }
.mcard.done { border-color: var(--tc); box-shadow: inset 0 0 0 3px var(--tc); }
.mcard.miss { border-color: var(--bad); }
@media (max-width: 520px) { .mem { gap: 6px; } .mcard { min-height: 92px; padding: 6px; } }

/* raad */
.hints { display: flex; flex-direction: column; gap: 10px; }
.hint { display: grid; grid-template-columns: 2.4em 1fr; gap: 12px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: clamp(1.1rem, 2.2vw, 1.6rem); }
.hint .num { width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; background: var(--oker); color: var(--bg); font-weight: 700; font-size: .8em; }
.hint.hidden-h { color: var(--muted); border-style: dashed; background: transparent; }
.pattern { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; letter-spacing: .25em; }
.answer { text-align: center; font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.4rem); color: var(--ok); }

/* galgje */
.hang { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
@media (max-width: 760px) { .hang { grid-template-columns: 1fr; } .hang svg { max-width: 220px; margin: 0 auto; } }
.slots { display: flex; flex-wrap: wrap; gap: 8px 6px; justify-content: center; font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.8rem); }
.slot { min-width: 1.05em; text-align: center; border-bottom: 4px solid var(--ink); line-height: 1.2; }
.slot.gap { border-bottom-color: transparent; min-width: .5em; }
.slot.lost { color: var(--bad); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.key { width: 2.6em; height: 2.6em; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 700; font-size: 1.05rem; }
.key.hit { background: var(--ok-soft); border-color: var(--ok); }
.key.miss { background: var(--bad-soft); border-color: var(--bad); opacity: .6; }
.temple .piece { fill: var(--oker); transition: opacity .3s; }
.temple .piece.lava { fill: var(--lapis); }
.temple .piece.rook { fill: var(--muted); opacity: .55; }
.temple .ghost { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 4; }
.sort { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.sort .opt { justify-content: center; font-size: clamp(1.2rem, 2.6vw, 1.7rem); font-family: var(--font-display); padding: 22px; }
.lives { text-align: center; font-weight: 700; color: var(--muted); }

/* flitskaarten */
.flash { perspective: 1400px; }
.flash-inner { position: relative; min-height: 300px; transition: transform .5s; transform-style: preserve-3d; cursor: pointer; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; border: 2px solid var(--line); background: var(--surface); padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; }
.face.back-f { transform: rotateY(180deg); background: var(--oker-soft); }
.face .big { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 4rem); line-height: 1.1; }
.face .def { font-size: clamp(1.2rem, 2.6vw, 1.9rem); line-height: 1.35; max-width: 34ch; }
.face .tip { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.25rem); }

/* bingo */
.wall { display: flex; flex-wrap: wrap; gap: 8px; }
.wall span { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: clamp(1rem, 1.8vw, 1.3rem); }
.wall span.called { background: var(--ok-soft); border-color: var(--ok); }
.howto { margin: 0; padding-left: 1.2em; color: var(--muted); }
.howto li + li { margin-top: 4px; }

/* lijst */
.tablewrap { overflow-x: auto; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 700; white-space: nowrap; }
td.x { color: var(--muted); }

.endbox { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 28px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.endbox h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
.note { color: var(--muted); font-size: .92rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const teamColor = i => `var(--t${i + 1})`;

function chapterTitle() {
  if (S.chapter === "mix") return "Alle hoofdstukken";
  return DATA[S.level].chapters.find(c => c.id === S.chapter).title;
}
function currentTerms(raw) {
  const chs = S.chapter === "mix" ? DATA[S.level].chapters : DATA[S.level].chapters.filter(c => c.id === S.chapter);
  const seen = new Set(), out = [];
  chs.forEach(c => c.terms.forEach(([w, d, x]) => {
    const k = w.toLowerCase();
    if (seen.has(k)) return;
    seen.add(k);
    out.push(raw ? { w, d, x: x || "" } : { w, d: mask(d, w), x: x ? mask(x, w) : "" });
  }));
  return out;
}
// Verberg het begrip zelf als het in de uitleg of tip staat.
function mask(text, w) {
  const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return text.replace(re, "…");
}

function nextTurn() { if (S.teams.length) S.turn = (S.turn + 1) % S.teams.length; }
function scoresHTML(showTurn) {
  return `<div class="scores" aria-label="Scores">${S.teams.map((t, i) => `
    <div class="score ${showTurn && i === S.turn ? "turn" : ""}" style="--tc:${teamColor(i)}">
      <span class="dot"></span><span>${esc(t.name)}</span><span class="n" aria-live="polite">${t.score}</span>
      <button class="pm" data-pm="${i}" data-d="-1" aria-label="Punt eraf voor ${esc(t.name)}">−</button>
      <button class="pm" data-pm="${i}" data-d="1" aria-label="Punt erbij voor ${esc(t.name)}">+</button>
    </div>`).join("")}</div>`;
}
function turnHTML() {
  if (S.teams.length < 2) return "";
  return `<div class="turnline" style="--tc:${teamColor(S.turn)}">Aan de beurt: <b>${esc(S.teams[S.turn].name)}</b></div>`;
}
function awardRow(label, pts, onDone) {
  const id = "aw" + Math.random().toString(36).slice(2, 7);
  setTimeout(() => {
    document.querySelectorAll(`[data-aw="${id}"]`).forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (i >= 0) award(i, pts);
      onDone(i);
    });
  });
  if (S.alleen) return `<div class="row"><span class="label">Had je het juist?</span><button class="btn" data-aw="${id}" data-i="0" style="border-color:${teamColor(0)}">Ja, +${pts}</button><button class="btn ghost" data-aw="${id}" data-i="-1">Nee, nog niet</button></div>`;
  const btns = S.teams.map((t, i) => `<button class="btn" data-aw="${id}" data-i="${i}" style="border-color:${teamColor(i)}">${esc(t.name)} +${pts}</button>`).join("");
  return `<div class="row"><span class="label">${label}</span>${btns}<button class="btn ghost" data-aw="${id}" data-i="-1">Niemand</button></div>`;
}

// ---------- alleen spelen ----------
// Andere uitleg bij de spellen als je alleen speelt. Bingo heeft iemand nodig die voorleest, dus dat valt dan weg.
function alleenTekst(g) {
  if (!S.alleen) return g;
  const d = {
    quiz: g.desc.replace(" Teams spelen om beurten.", ""),
    memory: g.desc.replace(" Wie een paar vindt, mag nog eens.", ""),
    flits: "Bekijk de kaart en zeg zelf wat het betekent. Draai ze daarna om en kijk of je juist was.",
  }[g.id];
  return d ? { ...g, desc: d } : g;
}

// ---------- menu ----------
function renderMenu() {
  S.view = "menu";
  const lvl = DATA[S.level];

    + `<button class="chip" data-ch="mix" aria-pressed="${S.chapter === "mix"}">Alle hoofdstukken door elkaar</button>`;

  const teams = S.teams.map((t, i) => `<label class="team-input"><i style="background:${teamColor(i)}"></i><input id="team-${i}" value="${esc(t.name)}" maxlength="24" aria-label="Naam team ${i + 1}"></label>`).join("");
  $app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="label">Uitdagingshoek · begrippen inoefenen</div>
        <h1>Begrippen<span>arena</span></h1>
        <p>Kies een hoofdstuk en een spel. Alle spellen gebruiken de begrippen uit de leerbundels, dus je kan ze vrij afwisselen.</p>
      </div>
      <div class="seg" role="group" aria-label="Niveau">
        ${Object.entries(DATA).map(([k, v]) => `<button data-lvl="${k}" aria-pressed="${S.level === k}">${esc(v.label)}</button>`).join("")}
      </div>

    <section style="display:flex;flex-direction:column;gap:10px">

    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between"><div class="label">2 · Spel</div><button class="linkbtn" data-list>Bekijk de begrippenlijst (${currentTerms().length})</button></div>
      <div class="games">${games}</div>
    </section>
    <section class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="label">Wie speelt er?</div>
        <div class="seg" role="group" aria-label="Wie speelt er">${[0, 1, 2, 3, 4].map(n => `<button data-nt="${n}" aria-pressed="${n === 0 ? S.alleen : !S.alleen && S.teams.length === n}">${n === 0 ? "Alleen" : n === 1 ? "Hele klas" : n + " teams"}</button>`).join("")}</div>
      </div>
      ${S.alleen ? `<p style="margin:0">Je speelt alleen. Je verdient punten voor jezelf. Begrippenbingo staat er niet bij, want daar heb je iemand voor nodig die voorleest.</p>` : `<div class="team-row">${teams}</div>`}
      <div class="row" style="justify-content:space-between">
        ${scoresHTML(false)}
        <button class="linkbtn" data-reset>Scores op nul</button>

  $app.querySelectorAll("[data-lvl]").forEach(b => b.onclick = () => { S.level = b.dataset.lvl; S.chapter = DATA[S.level].chapters[0].id; save(); renderMenu(); });
  $app.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => { S.chapter = b.dataset.ch; save(); renderMenu(); });
  $app.querySelectorAll("[data-game]").forEach(b => b.onclick = () => startGame(b.dataset.game));
  $app.querySelector("[data-list]").onclick = () => startGame("lijst");
  $app.querySelectorAll("[data-nt]").forEach(b => b.onclick = () => {
    const n = +b.dataset.nt;
    if (n === 0) { S.alleen = true; S.teams = [{ name: "Jij", score: 0 }]; S.turn = 0; save(); renderMenu(); return; }
    if (S.alleen) { S.alleen = false; S.teams = [{ name: "Klas", score: 0 }]; }
    while (S.teams.length < n) S.teams.push({ name: "Team " + (S.teams.length + 1), score: 0 });
    S.teams = S.teams.slice(0, n);
    if (n === 1 && /^Team \d$/.test(S.teams[0].name)) S.teams[0].name = "Klas";
    if (n > 1 && S.teams[0].name === "Klas") S.teams[0].name = "Team 1";

  });
  if (!S.alleen) S.teams.forEach((t, i) => { const inp = document.getElementById("team-" + i); inp.oninput = () => { t.name = inp.value || "Team " + (i + 1); save(); }; inp.onchange = renderMenu; });

function bindPM() {
  $app.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { award(+b.dataset.pm, +b.dataset.d); refreshScores(); });
}
function refreshScores() {
  const el = $app.querySelector(".scores");
  if (!el) return;
  el.outerHTML = scoresHTML(S.view === "game" && S.game && S.game.turnBased);
  bindPM();
}

// ---------- game shell ----------
function shell(gameName, inner) {
  return `
    <div class="bar">
      <div class="where"><span class="label">${esc(DATA[S.level].label)} · ${esc(chapterTitle())}</span><strong>${gameName}</strong></div>
      ${scoresHTML(S.game && S.game.turnBased)}
      <button class="btn ghost" data-back>← Menu</button>
    </div>
    <div class="stage">${inner}</div>`;
}
function mount(gameName, inner) {
  $app.innerHTML = shell(gameName, inner);
  $app.querySelector("[data-back]").onclick = () => { document.onkeydown = null; renderMenu(); };
  bindPM();
}
function startGame(id) {
  S.view = "game";
  document.onkeydown = null;
  const terms = currentTerms(id === "lijst");
  ({ quiz: Quiz, memory: Memory, raad: Raad, galgje: Galgje, flits: Flits, bingo: Bingo, sorteer: Sorteerband, lijst: Lijst })[id](terms);
  window.scrollTo(0, 0);
}
function endScreen(title, sub, again) {
  S.game.turnBased = false;
  const best = Math.max(...S.teams.map(t => t.score));
  const winners = S.teams.filter(t => t.score === best && best > 0).map(t => t.name);
  const line = S.alleen ? `Je hebt ${S.teams[0].score} ${S.teams[0].score === 1 ? "punt" : "punten"}.` : S.teams.length > 1 && winners.length ? (winners.length > 1 ? "Gelijkspel tussen " + winners.join(" en ") : winners[0] + " staat voor") : "";
  mount(title, `<div class="endbox"><div class="label">Klaar</div><h2>${esc(sub)}</h2>${line ? `<p style="font-size:1.2rem;margin:0">${esc(line)}</p>` : ""}<div class="row" style="justify-content:center"><button class="btn primary" data-again>Nog een ronde</button><button class="btn ghost" data-menu>Ander spel kiezen</button></div></div>`);
  $app.querySelector("[data-again]").onclick = again;
  $app.querySelector("[data-menu]").onclick = renderMenu;
}

// ---------- quiz ----------
function Quiz(terms, opts) {
  const reverse = opts && opts.reverse || false;
  const qs = shuffle(terms).slice(0, Math.min(10, terms.length));
  S.game = { turnBased: S.teams.length > 1 };
  let i = 0;
  function q() {
    const t = qs[i];
    const others = shuffle(terms.filter(o => o.w !== t.w)).slice(0, 3);
    const options = shuffle([t, ...others]);
    const prompt = reverse ? `<div class="prompt term">${esc(t.w)}</div>` : `<div class="prompt">${esc(t.d)}</div>`;
    mount("Quiz", `
      <div class="row" style="justify-content:space-between">
        <span class="progress">Vraag ${i + 1} van ${qs.length}</span>
        ${turnHTML()}
        <button class="linkbtn" data-rev>${reverse ? "Speel: uitleg → begrip" : "Speel omgekeerd: begrip → uitleg"}</button>
      </div>
      <div class="label">${reverse ? "Welke uitleg past bij dit begrip?" : "Welk begrip past bij deze uitleg?"}</div>
      ${prompt}
      <div class="options">${options.map((o, k) => `<button class="opt ${reverse ? "long" : ""}" data-o="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(reverse ? o.d : o.w)}</span></button>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><div class="feedback" aria-live="polite"></div><button class="btn primary" data-next hidden>${i + 1 < qs.length ? "Volgende vraag →" : "Bekijk de uitslag"}</button></div>`);
    $app.querySelector("[data-rev]").onclick = () => Quiz(terms, { reverse: !reverse });
    const btns = [...$app.querySelectorAll(".opt")];
    const answer = k => {
      if (btns[0].disabled) return;
      const ok = options[k] === t;
      btns.forEach((b, j) => { b.disabled = true; if (options[j] === t) b.classList.add("right"); });
      const fb = $app.querySelector(".feedback");
      if (ok) { award(S.turn, 1); fb.textContent = S.teams.length > 1 ? `Juist! +1 voor ${S.teams[S.turn].name}` : "Juist!"; fb.className = "feedback good"; }
      else { btns[k].classList.add("wrong"); fb.textContent = `Helaas. Het juiste antwoord is: ${t.w}`; fb.className = "feedback badc"; }
      refreshScores();
      const nx = $app.querySelector("[data-next]"); nx.hidden = false; nx.focus();
    };
    btns.forEach((b, k) => b.onclick = () => answer(k));
    $app.querySelector("[data-next]").onclick = () => { nextTurn(); i++; if (i < qs.length) q(); else endScreen("Quiz", "De quiz is gedaan", () => Quiz(terms, { reverse })); };
    document.onkeydown = e => {
      const k = "abcd".indexOf(e.key.toLowerCase()); const n = "1234".indexOf(e.key);
      if (k >= 0 && k < btns.length) answer(k); else if (n >= 0 && n < btns.length) answer(n);
    };
  }
  q();
}

// ---------- sorteerband ----------
function Sorteerband() {
  const sets = SORT[S.level] || Object.values(SORT)[0];
  const pool = shuffle(sets.flatMap(s => s.items.map(([naam, bak]) => ({ naam, bak, s }))));
  const qs = pool.slice(0, Math.min(12, pool.length));
  S.game = { turnBased: S.teams.length > 1 };
  let i = 0;
  function q() {
    const t = qs[i];
    mount("Sorteerspel", `
      <div class="row" style="justify-content:space-between">
        <span class="progress">Voorbeeld ${i + 1} van ${qs.length}</span>
        ${turnHTML()}
        <span class="label">${esc(t.s.vraag)}</span>
      </div>
      <div class="prompt term">${esc(t.naam)}</div>
      <div class="sort">${t.s.bakken.map((b, g) => `<button class="opt" data-g="${g}">${esc(b)}</button>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><div class="feedback" aria-live="polite"></div><button class="btn primary" data-next hidden>${i + 1 < qs.length ? "Volgende →" : "Bekijk de uitslag"}</button></div>`);
    const btns = [...$app.querySelectorAll("[data-g]")];
    const answer = g => {
      if (!btns[g] || btns[0].disabled) return;
      const ok = g === t.bak;
      btns.forEach((b, j) => { b.disabled = true; if (j === t.bak) b.classList.add("right"); });
      const fb = $app.querySelector(".feedback");
      const juist = `${t.naam.replace(/[.?!]$/, "")}: ${t.s.bakken[t.bak]}`;
      if (ok) { award(S.turn, 1); fb.textContent = (S.teams.length > 1 ? `Juist! +1 voor ${S.teams[S.turn].name}. ` : "Juist. ") + juist; fb.className = "feedback good"; }
      else { btns[g].classList.add("wrong"); fb.textContent = `Helaas. ${juist}.`; fb.className = "feedback badc"; }
      refreshScores();
      const nx = $app.querySelector("[data-next]"); nx.hidden = false; nx.focus();
    };
    btns.forEach((b, g) => b.onclick = () => answer(g));
    $app.querySelector("[data-next]").onclick = () => { nextTurn(); i++; if (i < qs.length) q(); else endScreen("Sorteerspel", "Alles is gesorteerd", Sorteerband); };
    document.onkeydown = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= btns.length) answer(n - 1); };
  }
  q();
}

// ---------- memory ----------
function Memory(terms, opts) {
  const pairs = Math.min(opts && opts.pairs || 8, terms.length);
  const pick = shuffle(terms).slice(0, pairs);
  const cards = shuffle(pick.flatMap((t, p) => [{ p, kind: "w", text: t.w }, { p, kind: "d", text: t.d }]));
  S.game = { turnBased: S.teams.length > 1 };
  let open = [], found = 0, owner = {}, waiting = false;
  function draw() {
    mount("Memory", `
      <div class="row" style="justify-content:space-between">
        <span class="progress">${found} van ${pairs} paren gevonden</span>
        ${turnHTML()}
        <div class="row"><span class="label">Paren</span>${[6, 8].map(n => `<button class="btn ${n === pairs ? "primary" : "ghost"}" data-pairs="${n}">${n}</button>`).join("")}</div>
      </div>
      <div class="mem">${cards.map((c, k) => {
        const isOpen = open.includes(k) || owner[c.p] !== undefined;
        const cls = ["mcard", isOpen ? "open " + c.kind : "", owner[c.p] !== undefined ? "done" : "", waiting && open.includes(k) ? "miss" : ""].join(" ");
        const style = owner[c.p] !== undefined && owner[c.p] >= 0 ? `style="--tc:${teamColor(owner[c.p])}"` : `style="--tc:var(--ok)"`;
        return `<button class="${cls}" ${style} data-c="${k}" aria-label="${isOpen ? esc(c.text) : "Gesloten kaart " + (k + 1)}">${isOpen ? esc(c.text) : '<span class="back">?</span>'}</button>`;
      }).join("")}</div>
      <div class="row" style="justify-content:space-between"><div class="feedback" aria-live="polite">${waiting ? "Geen paar." : ""}</div><button class="btn primary" data-flip ${waiting ? "" : "hidden"}>Kaarten omdraaien${S.teams.length > 1 ? " · volgend team" : ""}</button></div>
      <p class="note">Blauwe kaarten zijn nog dicht. Een begrip hoort bij de uitleg op een oranje kaart.</p>`);
    $app.querySelectorAll("[data-pairs]").forEach(b => b.onclick = () => Memory(terms, { pairs: +b.dataset.pairs }));
    $app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => flip(+b.dataset.c));
    const fl = $app.querySelector("[data-flip]"); if (fl) fl.onclick = () => { open = []; waiting = false; nextTurn(); draw(); };
  }
  function flip(k) {
    if (waiting || open.includes(k) || owner[cards[k].p] !== undefined) return;
    open.push(k);
    if (open.length === 2) {
      const [a, b] = open.map(n => cards[n]);
      if (a.p === b.p) {
        owner[a.p] = S.teams.length ? S.turn : -1; award(S.turn, 1); found++; open = [];
        if (found === pairs) { draw(); setTimeout(() => endScreen("Memory", "Alle paren zijn gevonden", () => Memory(terms, { pairs })), 900); return; }
      } else waiting = true;
    }
    draw();
  }
  draw();
}

// ---------- raad het begrip ----------
function Raad(terms) {
  const rounds = shuffle(terms).slice(0, Math.min(10, terms.length));
  S.game = { turnBased: false };
  let i = 0;
  function pattern(w) { return [...w].map((ch, k) => k === 0 ? ch.toUpperCase() : (/\p{L}/u.test(ch) ? "_" : (ch === " " ? "  " : ch))).join(" "); }
  function round() {
    const t = rounds[i];
    const hints = [{ txt: t.d, lab: "Uitleg" }];
    if (t.x) hints.push({ txt: t.x, lab: "Extra tip" });
    const letters = [...t.w].filter(c => /\p{L}/u.test(c)).length;
    hints.push({ txt: `<span class="pattern">${esc(pattern(t.w))}</span><br><small class="note">${letters} letters</small>`, lab: "Letters", raw: true });
    let shown = 1, revealed = false;
    function draw() {
      const pts = Math.max(1, hints.length - shown + 1);
      mount("Raad het begrip", `
        <div class="row" style="justify-content:space-between"><span class="progress">Begrip ${i + 1} van ${rounds.length}</span><span class="label">Nu raden = ${pts} ${pts === 1 ? "punt" : "punten"}</span></div>
        <div class="hints">${hints.map((h, k) => k < shown || revealed
          ? `<div class="hint"><span class="num">${k + 1}</span><div><div class="label">${h.lab}</div>${h.raw ? h.txt : esc(h.txt)}</div></div>`
          : `<div class="hint hidden-h"><span class="num" style="background:var(--line)">${k + 1}</span><div>Hint ${k + 1} is nog verborgen</div></div>`).join("")}</div>
        ${revealed ? `<div class="answer">${esc(t.w)}</div>` : ""}
        ${revealed ? `<div class="row end"><button class="btn primary" data-nextr>${i + 1 < rounds.length ? "Volgend begrip →" : "Bekijk de uitslag"}</button></div>`
          : `<div class="row"><button class="btn oker" data-hint ${shown >= hints.length ? "disabled" : ""}>Volgende hint</button><button class="btn" data-show>Toon antwoord</button></div>
             ${awardRow("Goed geraden door", pts, () => { revealed = true; refreshAfter(); })}`}`);
      const h = $app.querySelector("[data-hint]"); if (h) h.onclick = () => { shown++; draw(); };
      const s = $app.querySelector("[data-show]"); if (s) s.onclick = () => { revealed = true; draw(); };
      const n = $app.querySelector("[data-nextr]"); if (n) n.onclick = () => { i++; if (i < rounds.length) round(); else endScreen("Raad het begrip", "Alle begrippen zijn geraden", () => Raad(terms)); };
    }
    function refreshAfter() { draw(); }
    draw();
  }
  round();
}

// ---------- galgje / raket ----------
function Galgje(terms, used) {
  used = used || new Set();
  const pool = terms.filter(t => !used.has(t.w) && [...t.w].filter(c => /\p{L}/u.test(c)).length >= 3);
  if (!pool.length) { used.clear(); return Galgje(terms, used); }
  const t = shuffle(pool)[0]; used.add(t.w);
  const MAX = 8;
  const target = [...t.w];
  const guessed = new Set(); let wrong = 0, done = false, won = false;
  S.game = { turnBased: S.teams.length > 1 };
  const isLetter = c => /\p{L}/u.test(c);
  const allFound = () => target.every(c => !isLetter(c) || guessed.has(fold(c)));
  function temple() {
    // 8 stukken: lanceerplatform, romp, neus, venster, twee vinnen, vlam, rook
    const p = [
      ["", `<rect x="40" y="198" width="160" height="10" rx="3"/>`],
      ["", `<rect x="100" y="70" width="40" height="110" rx="6"/>`],
      ["lava", `<path d="M100 72 C102 46 112 30 120 20 C128 30 138 46 140 72 Z"/>`],
      ["lava", `<circle cx="120" cy="100" r="11"/>`],
      ["lava", `<path d="M100 140 L76 182 L100 172 Z"/>`],
      ["lava", `<path d="M140 140 L164 182 L140 172 Z"/>`],
      ["", `<path d="M108 180 L132 180 L126 196 L120 190 L114 196 Z"/>`],
      ["rook", `<path d="M70 196 a14 10 0 1 1 26 -4 a12 9 0 1 1 22 2 Z M150 196 a14 10 0 1 1 26 -4 a10 8 0 1 1 12 4 Z"/>`]
    ];
    return `<svg class="temple" viewBox="0 0 240 216" role="img" aria-label="${wrong} van ${MAX} stukken van de raket staan er">
      ${p.map(([c, s], k) => s.replace(/^<(rect|path|circle)/, `<$1 class="${k < wrong ? "piece " + c : "ghost"}"`)).join("")}
    </svg>`;
  }
  function draw() {
    const slots = target.map(c => {
      if (c === " ") return `<span class="slot gap"> </span>`;
      if (!isLetter(c)) return `<span class="slot">${esc(c)}</span>`;
      const show = guessed.has(fold(c)) || done;
      return `<span class="slot ${done && !guessed.has(fold(c)) ? "lost" : ""}">${show ? esc(c.toUpperCase()) : "&nbsp;"}</span>`;
    }).join("");
    const keys = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L => {
      const inWord = target.some(c => fold(c) === L);
      const cls = guessed.has(L) ? (inWord ? "hit" : "miss") : "";
      return `<button class="key ${cls}" data-k="${L}" ${guessed.has(L) || done ? "disabled" : ""}>${L}</button>`;
    }).join("");
    mount("Raketgalgje", `
      ${done ? "" : `<div class="row" style="justify-content:space-between">${turnHTML()}<span class="label">Raad letter per letter, of zeg het hele begrip</span></div>`}
      <div class="hang">
        <div class="stage">
          <div class="prompt" style="min-height:0;font-size:clamp(1.1rem,2.2vw,1.6rem)"><div><div class="label" style="font-family:var(--font-body)">Uitleg</div>${esc(t.d)}</div></div>
          <div class="slots" aria-live="polite">${slots}</div>
          ${done ? `<div class="feedback ${won ? "good" : "badc"}" style="text-align:center;font-size:1.4rem">${won ? "Geraden!" : "De raket is klaar. Het begrip was: " + esc(t.w)}</div>` : `<div class="keys">${keys}</div>`}
          ${done ? (won && S.teams.length && !S.alleen ? awardRow("Punt voor", 2, () => next()) : `<div class="row end"><button class="btn primary" data-nw>Nieuw begrip →</button></div>`)
                 : `<div class="row end"><button class="btn" data-solve>Iemand weet het hele begrip</button></div>`}
        </div>
        <div>${temple()}<div class="lives">${MAX - wrong} foute letters over</div></div>
      </div>`);
    $app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => guess(b.dataset.k));
    const sv = $app.querySelector("[data-solve]"); if (sv) sv.onclick = () => { target.forEach(c => isLetter(c) && guessed.add(fold(c))); done = true; won = true; draw(); };
    const nw = $app.querySelector("[data-nw]"); if (nw) nw.onclick = next;
  }
  function next() { nextTurn(); Galgje(terms, used); }
  function guess(L) {
    if (done || guessed.has(L)) return;
    guessed.add(L);
    if (!target.some(c => fold(c) === L)) { wrong++; nextTurn(); }
    if (allFound()) { done = true; won = true; if (S.alleen) award(0, 2); }
    else if (wrong >= MAX) { done = true; }
    draw();
  }
  document.onkeydown = e => { if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== "INPUT") guess(e.key.toUpperCase()); };
  draw();
}

// ---------- flitskaarten ----------
function Flits(terms, opts) {
  const defFirst = opts && opts.defFirst || false;
  let deck = shuffle(terms), i = 0, flipped = false;
  S.game = { turnBased: false };
  function draw() {
    const t = deck[i];
    const front = defFirst ? `<div class="def">${esc(t.d)}</div>` : `<div class="big">${esc(t.w)}</div>`;
    const back = defFirst ? `<div class="big">${esc(t.w)}</div>${t.x ? `<div class="tip">${esc(t.x)}</div>` : ""}` : `<div class="def">${esc(t.d)}</div>${t.x ? `<div class="tip">Tip: ${esc(t.x)}</div>` : ""}`;
    mount("Flitskaarten", `
      <div class="row" style="justify-content:space-between"><span class="progress">Kaart ${i + 1} van ${deck.length}</span>
        <button class="linkbtn" data-mode>${defFirst ? "Toon eerst het begrip" : "Toon eerst de uitleg"}</button></div>
      <div class="flash ${flipped ? "flipped" : ""}"><div class="flash-inner" data-turn role="button" tabindex="0" aria-label="Kaart omdraaien">
        <div class="face"><div class="label">${defFirst ? "Welk begrip is dit?" : "Wat betekent dit?"}</div>${front}</div>
        <div class="face back-f"><div class="label">${defFirst ? "Begrip" : "Uitleg"}</div>${back}</div>
      </div></div>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" data-prev ${i === 0 ? "disabled" : ""}>← Vorige</button>
        <button class="btn oker" data-flipc>Draai om</button>
        <button class="btn primary" data-nextc ${i + 1 >= deck.length ? "disabled" : ""}>Volgende →</button>
        <button class="btn ghost" data-shuf>Schudden</button>
      </div>
      <p class="note" style="text-align:center">Spatiebalk draait de kaart, pijltjes gaan naar de vorige of volgende.</p>`);
    const turn = () => { flipped = !flipped; $app.querySelector(".flash").classList.toggle("flipped", flipped); };
    $app.querySelector("[data-turn]").onclick = turn;
    $app.querySelector("[data-flipc]").onclick = turn;
    $app.querySelector("[data-prev]").onclick = () => { if (i > 0) { i--; flipped = false; draw(); } };
    $app.querySelector("[data-nextc]").onclick = () => { if (i + 1 < deck.length) { i++; flipped = false; draw(); } };
    $app.querySelector("[data-shuf]").onclick = () => { deck = shuffle(terms); i = 0; flipped = false; draw(); };
    $app.querySelector("[data-mode]").onclick = () => Flits(terms, { defFirst: !defFirst });
    document.onkeydown = e => {
      if (e.key === " ") { e.preventDefault(); turn(); }
      else if (e.key === "ArrowRight") $app.querySelector("[data-nextc]").click();
      else if (e.key === "ArrowLeft") $app.querySelector("[data-prev]").click();
    };
  }
  draw();
}

// ---------- bingo ----------
function Bingo(terms, opts) {
  const size = opts && opts.size || 3;
  const max = size === 3 ? 18 : 28;
  const set = opts && opts.set || shuffle(terms).slice(0, Math.min(max, terms.length));
  S.game = { turnBased: false };
  let order = null, i = -1, showCalled = false;
  function setup() {
    mount("Begrippenbingo", `
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <div class="label">Stap 1 · Rooster maken</div>
          <div class="seg" role="group" aria-label="Grootte">${[3, 4].map(n => `<button data-size="${n}" aria-pressed="${n === size}">${n} × ${n}</button>`).join("")}</div>
        </div>
        <ol class="howto">
          <li>Iedereen tekent een rooster van ${size} bij ${size} vakjes.</li>
          <li>Kies ${size * size} begrippen uit de lijst hieronder en schrijf er één in elk vakje.</li>
          <li>Jij leest telkens een uitleg voor. Wie het begrip op zijn rooster heeft, kruist het aan.</li>
          <li>Een volle rij, kolom of diagonaal? Roep BINGO en lees je begrippen voor.</li>
        </ol>
      </div>
      <div class="wall">${set.map(t => `<span>${esc(t.w)}</span>`).join("")}</div>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" data-newset>Andere begrippen kiezen</button>
        <button class="btn primary" data-start>Start de bingo →</button>
      </div>`);
    $app.querySelectorAll("[data-size]").forEach(b => b.onclick = () => Bingo(terms, { size: +b.dataset.size }));
    $app.querySelector("[data-newset]").onclick = () => Bingo(terms, { size });
    $app.querySelector("[data-start]").onclick = () => { order = shuffle(set); i = 0; play(); };
  }
  function play() {
    const t = order[i];
    const called = order.slice(0, i + 1);
    mount("Begrippenbingo", `
      <div class="row" style="justify-content:space-between"><span class="progress">Uitleg ${i + 1} van ${order.length}</span><button class="linkbtn" data-setup>Terug naar de woordenlijst</button></div>
      <div class="prompt">${esc(t.d)}</div>
      <div class="row" style="justify-content:space-between">
        <button class="btn" data-check>${showCalled ? "Verberg de afgeroepen begrippen" : "Controleer een bingo"}</button>
        <button class="btn primary" data-nextb ${i + 1 >= order.length ? "disabled" : ""}>Volgende uitleg →</button>
      </div>
      ${showCalled ? `<div class="label">Al afgeroepen (groen)</div><div class="wall">${set.map(s => `<span class="${called.includes(s) ? "called" : ""}">${esc(s.w)}</span>`).join("")}</div>` : ""}`);
    $app.querySelector("[data-nextb]").onclick = () => { if (i + 1 < order.length) { i++; play(); } };
    $app.querySelector("[data-check]").onclick = () => { showCalled = !showCalled; play(); };
    $app.querySelector("[data-setup]").onclick = setup;
    document.onkeydown = e => { if (e.key === "ArrowRight") $app.querySelector("[data-nextb]").click(); };
  }
  setup();
}

// ---------- lijst ----------
function Lijst(terms) {
  S.game = { turnBased: false };
  const sorted = terms.slice().sort((a, b) => a.w.localeCompare(b.w, "nl"));
  mount("Begrippenlijst", `
    <p class="note" style="margin:0">${terms.length} begrippen. In de spellen wordt het begrip zelf in de uitleg vervangen door “…”, zodat het antwoord niet verklapt wordt.</p>
    <div class="tablewrap"><table><thead><tr><th>Begrip</th><th>Uitleg</th><th>Extra tip</th></tr></thead>
    <tbody>${sorted.map(t => `<tr><td>${esc(t.w)}</td><td>${esc(t.d)}</td><td class="x">${esc(t.x)}</td></tr>`).join("")}</tbody></table></div>`);
}

renderMenu();
</script>
