<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Waarom geef je een gevonden portefeuille terug?</text>
<rect x="60" y="80" width="420" height="200" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<path d="M 140 280 L 130 320 L 180 280" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<line x1="142" y1="280" x2="178" y2="280" stroke="#ffffff" stroke-width="4"/>
<text x="260" y="158" font-size="23" text-anchor="middle" fill="#24331b">Anders pakt de politie</text>
<text x="260" y="192" font-size="23" text-anchor="middle" fill="#24331b">mij misschien op.</text>
<circle cx="445" cy="250" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="445" y="257" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<rect x="520" y="80" width="420" height="200" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<path d="M 600 280 L 590 320 L 640 280" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<line x1="602" y1="280" x2="638" y2="280" stroke="#ffffff" stroke-width="4"/>
<text x="720" y="158" font-size="23" text-anchor="middle" fill="#24331b">Zo staat het in de wet,</text>
<text x="720" y="192" font-size="23" text-anchor="middle" fill="#24331b">en zo hoort het nu eenmaal.</text>
<circle cx="905" cy="250" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="905" y="257" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<rect x="60" y="350" width="420" height="200" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<path d="M 140 550 L 130 590 L 180 550" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<line x1="142" y1="550" x2="178" y2="550" stroke="#ffffff" stroke-width="4"/>
<text x="260" y="411" font-size="23" text-anchor="middle" fill="#24331b">Eerlijkheid is voor mij</text>
<text x="260" y="445" font-size="23" text-anchor="middle" fill="#24331b">belangrijker dan wat</text>
<text x="260" y="479" font-size="23" text-anchor="middle" fill="#24331b">ik ermee zou winnen.</text>
<circle cx="445" cy="520" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="445" y="527" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<rect x="520" y="350" width="420" height="200" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<path d="M 600 550 L 590 590 L 640 550" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<line x1="602" y1="550" x2="638" y2="550" stroke="#ffffff" stroke-width="4"/>
<text x="720" y="428" font-size="23" text-anchor="middle" fill="#24331b">Misschien krijg ik</text>
<text x="720" y="462" font-size="23" text-anchor="middle" fill="#24331b">wel een beloning.</text>
<circle cx="905" cy="520" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="905" y="527" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
</svg>
