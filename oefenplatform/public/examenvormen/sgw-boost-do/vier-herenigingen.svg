<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Vier kinderen van één jaar: mama komt terug in de speelkamer</text>
<rect x="50" y="70" width="440" height="240" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<rect x="68" y="88" width="34" height="54" rx="3" fill="#e8dcc0" stroke="#24331b" stroke-width="2"/>
<circle cx="94" cy="117" r="3" fill="#24331b" stroke="#24331b" stroke-width="1"/>
<text x="120" y="125" font-size="21" text-anchor="start" fill="#24331b">Mila kijkt niet op als mama</text>
<text x="120" y="165" font-size="21" text-anchor="start" fill="#24331b">binnenkomt. Ze speelt verder</text>
<text x="120" y="205" font-size="21" text-anchor="start" fill="#24331b">en draait zich weg.</text>
<text x="120" y="245" font-size="21" text-anchor="start" fill="#24331b">Haar hartslag gaat wel omhoog.</text>
<circle cx="455" cy="275" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="455" y="282" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<rect x="510" y="70" width="440" height="240" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<rect x="528" y="88" width="34" height="54" rx="3" fill="#e8dcc0" stroke="#24331b" stroke-width="2"/>
<circle cx="554" cy="117" r="3" fill="#24331b" stroke="#24331b" stroke-width="1"/>
<text x="580" y="125" font-size="21" text-anchor="start" fill="#24331b">Tuur huilde toen mama wegging.</text>
<text x="580" y="165" font-size="21" text-anchor="start" fill="#24331b">Nu kruipt hij naar haar toe,</text>
<text x="580" y="205" font-size="21" text-anchor="start" fill="#24331b">laat zich troosten en</text>
<text x="580" y="245" font-size="21" text-anchor="start" fill="#24331b">gaat snel weer spelen.</text>
<circle cx="915" cy="275" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="915" y="282" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<rect x="50" y="345" width="440" height="240" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<rect x="68" y="363" width="34" height="54" rx="3" fill="#e8dcc0" stroke="#24331b" stroke-width="2"/>
<circle cx="94" cy="392" r="3" fill="#24331b" stroke="#24331b" stroke-width="1"/>
<text x="120" y="400" font-size="21" text-anchor="start" fill="#24331b">Jana steekt haar armpjes uit,</text>
<text x="120" y="440" font-size="21" text-anchor="start" fill="#24331b">klampt zich vast en</text>
<text x="120" y="480" font-size="21" text-anchor="start" fill="#24331b">duwt mama dan boos weg.</text>
<text x="120" y="520" font-size="21" text-anchor="start" fill="#24331b">Ze is lang niet te troosten.</text>
<circle cx="455" cy="550" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="455" y="557" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<rect x="510" y="345" width="440" height="240" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<rect x="528" y="363" width="34" height="54" rx="3" fill="#e8dcc0" stroke="#24331b" stroke-width="2"/>
<circle cx="554" cy="392" r="3" fill="#24331b" stroke="#24331b" stroke-width="1"/>
<text x="580" y="400" font-size="21" text-anchor="start" fill="#24331b">Lars loopt naar mama, blijft</text>
<text x="580" y="440" font-size="21" text-anchor="start" fill="#24331b">halverwege stokstijf staan</text>
<text x="580" y="480" font-size="21" text-anchor="start" fill="#24331b">en kijkt verward rond.</text>
<text x="580" y="520" font-size="21" text-anchor="start" fill="#24331b">Dan gaat hij op de grond zitten.</text>
<circle cx="915" cy="550" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="915" y="557" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
</svg>
