<text x='54' y='180' font-family='Nunito, Arial, sans-serif' font-size='21' fill='#2b2b2b'>Als het vriest, is het ijs op de vijver dik.</text>
<text x='54' y='222' font-family='Nunito, Arial, sans-serif' font-size='21' fill='#2b2b2b'>Het vriest.</text>
<text x='54' y='264' font-family='Nunito, Arial, sans-serif' font-size='21' font-weight='800' fill='#2b2b2b'>Dus het ijs is dik.</text>
