<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<rect x="110" y="24" width="780" height="596" rx="24" fill="#ffffff" stroke="#b5651d" stroke-width="4"/>
<text x="500" y="92" font-size="46" text-anchor="middle" fill="#b5651d" font-weight="bold">Sapbar Fris</text>
<text x="500" y="132" font-size="22" text-anchor="middle" fill="#24331b">nieuw aan het station van Hasselt</text>
<circle cx="170" cy="209" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="170" y="216" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="210" y="205" font-size="22" text-anchor="start" fill="#24331b">Verse smoothies met Limburgs fruit,</text>
<text x="210" y="235" font-size="22" text-anchor="start" fill="#24331b">in een beker die je terugbrengt.</text>
<circle cx="170" cy="295" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="170" y="302" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="210" y="291" font-size="22" text-anchor="start" fill="#24331b">4,50 euro per smoothie,</text>
<text x="210" y="321" font-size="22" text-anchor="start" fill="#24331b">de tweede aan halve prijs.</text>
<circle cx="170" cy="381" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="170" y="388" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="210" y="377" font-size="22" text-anchor="start" fill="#24331b">In de stationshal,</text>
<text x="210" y="407" font-size="22" text-anchor="start" fill="#24331b">elke werkdag vanaf 6 uur.</text>
<circle cx="170" cy="467" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="170" y="474" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="210" y="463" font-size="22" text-anchor="start" fill="#24331b">Bestel vooraf in de app:</text>
<text x="210" y="493" font-size="22" text-anchor="start" fill="#24331b">je smoothie staat klaar als je trein vertrekt.</text>
<circle cx="170" cy="553" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="170" y="560" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="210" y="549" font-size="22" text-anchor="start" fill="#24331b">Deel je foto met #sapbarfris</text>
<text x="210" y="579" font-size="22" text-anchor="start" fill="#24331b">en win een maand gratis smoothies.</text>
</svg>
