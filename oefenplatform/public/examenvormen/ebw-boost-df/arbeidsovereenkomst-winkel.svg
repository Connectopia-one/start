<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<rect x="70" y="24" width="860" height="596" rx="14" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<rect x="70" y="24" width="860" height="66" rx="14" fill="#a8c98a" stroke="#24331b" stroke-width="3"/>
<text x="500" y="67" font-size="26" text-anchor="middle" fill="#24331b" font-weight="bold">Arbeidsovereenkomst voor bedienden</text>
<circle cx="118" cy="138" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="145" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="156" y="145" font-size="20" text-anchor="start" fill="#24331b">Tussen de bv Groen &amp; Fris, Alken, en mevrouw Sara Peeters, Hasselt.</text>
<circle cx="118" cy="206" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="213" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="156" y="213" font-size="20" text-anchor="start" fill="#24331b">Mevrouw Peeters werkt als verkoopster in de winkel.</text>
<circle cx="118" cy="274" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="281" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="156" y="281" font-size="20" text-anchor="start" fill="#24331b">De overeenkomst begint op 1 maart 2027.</text>
<circle cx="118" cy="342" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="349" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="156" y="349" font-size="20" text-anchor="start" fill="#24331b">De overeenkomst eindigt op 31 augustus 2027.</text>
<circle cx="118" cy="410" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="417" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="156" y="417" font-size="20" text-anchor="start" fill="#24331b">Ze werkt 19 uur per week, van woensdag tot vrijdag.</text>
<circle cx="118" cy="478" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="485" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">F</text>
<text x="156" y="485" font-size="20" text-anchor="start" fill="#24331b">Het brutoloon is 15,20 euro per uur, betaald op de laatste dag van de maand.</text>
<circle cx="118" cy="546" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="118" y="553" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">G</text>
<text x="156" y="553" font-size="20" text-anchor="start" fill="#24331b">Ze volgt de opdrachten van de winkelverantwoordelijke.</text>
</svg>
