<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<rect x="70" y="30" width="860" height="580" rx="14" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<rect x="70" y="30" width="860" height="70" rx="14" fill="#a8c98a" stroke="#24331b" stroke-width="3"/>
<text x="500" y="76" font-size="26" text-anchor="middle" fill="#24331b" font-weight="bold">Fietsen Trappers zoekt een magazijnier (m/v/x)</text>
<circle cx="120" cy="153" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="160" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="160" y="160" font-size="21" text-anchor="start" fill="#24331b">Je ontvangt leveringen, slaat fietsen op en maakt bestellingen klaar.</text>
<circle cx="120" cy="219" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="226" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="160" y="226" font-size="21" text-anchor="start" fill="#24331b">Je hebt een diploma secundair onderwijs.</text>
<circle cx="120" cy="285" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="292" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="160" y="292" font-size="21" text-anchor="start" fill="#24331b">Je werkte al minstens één jaar in een magazijn.</text>
<circle cx="120" cy="351" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="358" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="160" y="358" font-size="21" text-anchor="start" fill="#24331b">Je kan met een heftruck rijden en een rekenblad gebruiken.</text>
<circle cx="120" cy="417" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="424" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="160" y="424" font-size="21" text-anchor="start" fill="#24331b">Je bent punctueel, nauwkeurig en je werkt graag samen.</text>
<circle cx="120" cy="483" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="490" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">F</text>
<text x="160" y="490" font-size="21" text-anchor="start" fill="#24331b">Wij bieden een vast contract, een fietsvergoeding en opleiding.</text>
<circle cx="120" cy="549" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="120" y="556" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">G</text>
<text x="160" y="556" font-size="21" text-anchor="start" fill="#24331b">Stuur je cv en je sollicitatiebrief vóór 15 december.</text>
</svg>
