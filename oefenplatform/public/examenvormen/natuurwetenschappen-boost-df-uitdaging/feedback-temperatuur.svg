<text x='110.0' y='200.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='20' fill='#2b2b2b'>Je loopt in</text>
<text x='110.0' y='228.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='20' fill='#2b2b2b'>de zon en</text>
