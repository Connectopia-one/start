<text x='498.0' y='214.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='20' fill='#2b2b2b'>Zenuwen en</text>
<text x='498.0' y='242.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='20' fill='#2b2b2b'>de hersenen</text>
