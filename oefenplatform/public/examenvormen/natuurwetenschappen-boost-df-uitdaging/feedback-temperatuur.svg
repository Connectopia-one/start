<text x='304.0' y='200.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='20' fill='#2b2b2b'>Warmtezintuig-</text>
<text x='304.0' y='228.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='20' fill='#2b2b2b'>cellen in</text>
