<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Un samedi pas comme les autres</text>
<rect x="50" y="55" width="900" height="570" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<circle cx="95" cy="133" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="95" y="140" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="135" y="140" font-size="22" text-anchor="start" fill="#24331b">C'était un samedi d'hiver et il neigeait depuis le matin.</text>
<circle cx="95" cy="218" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="95" y="225" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="135" y="225" font-size="22" text-anchor="start" fill="#24331b">Comme d'habitude, ma sœur regardait des dessins animés.</text>
<circle cx="95" cy="303" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="95" y="310" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="135" y="310" font-size="22" text-anchor="start" fill="#24331b">Tout à coup, quelqu'un a sonné à la porte.</text>
<circle cx="95" cy="388" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="95" y="395" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="135" y="395" font-size="22" text-anchor="start" fill="#24331b">C'était notre voisin : il avait perdu son chat</text>
<text x="135" y="427" font-size="22" text-anchor="start" fill="#24331b">la veille au soir.</text>
<circle cx="95" cy="503" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="95" y="510" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="135" y="510" font-size="22" text-anchor="start" fill="#24331b">Nous sommes sortis tous ensemble et nous l'avons</text>
<text x="135" y="542" font-size="22" text-anchor="start" fill="#24331b">retrouvé dans le garage.</text>
</svg>
