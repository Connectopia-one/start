<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Une mail à un camping</text>
<rect x="80" y="55" width="840" height="570" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<rect x="80" y="55" width="840" height="50" rx="10" fill="#d9d4c4" stroke="#24331b" stroke-width="3"/>
<text x="110" y="88" font-size="18" text-anchor="start" fill="#24331b">À : info@camping-des-pins.fr      Objet : réservation</text>
<circle cx="125" cy="153" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="125" y="160" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="165" y="160" font-size="21" text-anchor="start" fill="#24331b">Madame, Monsieur,</text>
<circle cx="125" cy="218" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="125" y="225" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="165" y="225" font-size="21" text-anchor="start" fill="#24331b">Je vous écris au sujet de votre annonce pour des emplacements en août.</text>
<circle cx="125" cy="293" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="125" y="300" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="165" y="300" font-size="21" text-anchor="start" fill="#24331b">Nous sommes quatre personnes avec une tente et nous voudrions</text>
<text x="165" y="332" font-size="21" text-anchor="start" fill="#24331b">rester du 3 au 10 août.</text>
<circle cx="125" cy="388" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="125" y="395" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="165" y="395" font-size="21" text-anchor="start" fill="#24331b">Pourriez-vous me dire s'il reste de la place et quel est le prix ?</text>
<text x="165" y="427" font-size="21" text-anchor="start" fill="#24331b">Est-ce que les chiens sont acceptés ?</text>
<circle cx="125" cy="493" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="125" y="500" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="165" y="500" font-size="21" text-anchor="start" fill="#24331b">Bisous et à plus,</text>
<text x="165" y="532" font-size="21" text-anchor="start" fill="#24331b">Emma Peeters</text>
</svg>
