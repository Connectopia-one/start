<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Cinq petits dialogues</text>
<rect x="40" y="55" width="920" height="570" rx="10" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<circle cx="85" cy="138" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="85" y="145" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="125" y="130" font-size="22" text-anchor="start" fill="#24331b">— Tu as vu mes clés ?</text>
<text x="125" y="164" font-size="22" text-anchor="start" fill="#24331b">— Oui, je les ai mises sur la table.</text>
<circle cx="85" cy="243" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="85" y="250" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="125" y="235" font-size="22" text-anchor="start" fill="#24331b">— Tu vas à la piscine demain ?</text>
<text x="125" y="269" font-size="22" text-anchor="start" fill="#24331b">— Oui, j'y vais avec Léa.</text>
<circle cx="85" cy="348" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="85" y="355" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="125" y="340" font-size="22" text-anchor="start" fill="#24331b">— Tu veux du gâteau ?</text>
<text x="125" y="374" font-size="22" text-anchor="start" fill="#24331b">— Non merci, j'en ai déjà mangé.</text>
<circle cx="85" cy="453" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="85" y="460" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="125" y="445" font-size="22" text-anchor="start" fill="#24331b">— Tu as écrit à tes grands-parents ?</text>
<text x="125" y="479" font-size="22" text-anchor="start" fill="#24331b">— Oui, je leur ai écrit une carte.</text>
<circle cx="85" cy="558" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="85" y="565" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="125" y="550" font-size="22" text-anchor="start" fill="#24331b">— Tu viens avec Hugo ?</text>
<text x="125" y="584" font-size="22" text-anchor="start" fill="#24331b">— Non, je viens sans lui.</text>
</svg>
