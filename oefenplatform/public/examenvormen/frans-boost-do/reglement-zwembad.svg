<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Piscine communale – Règlement</text>
<rect x="60" y="55" width="880" height="570" rx="14" fill="#eaf4fb" stroke="#3b6fa0" stroke-width="5"/>
<text x="500" y="110" font-size="34" text-anchor="middle" fill="#3b6fa0" font-weight="bold">RÈGLEMENT</text>
<circle cx="105" cy="183" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="105" y="190" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="145" y="190" font-size="22" text-anchor="start" fill="#24331b">Prenez une douche avant d'entrer dans l'eau.</text>
<circle cx="105" cy="268" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="105" y="275" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="145" y="275" font-size="22" text-anchor="start" fill="#24331b">Ne courez pas au bord du bassin.</text>
<circle cx="105" cy="353" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="105" y="360" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="145" y="360" font-size="22" text-anchor="start" fill="#24331b">Il faut porter un bonnet de bain.</text>
<circle cx="105" cy="438" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="105" y="445" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="145" y="445" font-size="22" text-anchor="start" fill="#24331b">Les enfants de moins de 8 ans doivent être accompagnés.</text>
<circle cx="105" cy="523" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="105" y="530" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="145" y="530" font-size="22" text-anchor="start" fill="#24331b">Nous venons de rénover les vestiaires : merci de les respecter !</text>
</svg>
