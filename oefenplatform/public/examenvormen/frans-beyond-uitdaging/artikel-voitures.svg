<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 672' width='1000' height='672'>
<rect width='1000' height='672' fill='#ffffff'/>
<text x='40' y='58' font-family='Nunito, Arial, sans-serif' font-size='30' font-weight='800' fill='#2f4a22'>Des villes sans voitures ?</text>
<rect x='24' y='96' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='136.0' r='22' fill='#2f4a22'/>
<text x='68' y='144.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>1</text>
<text x='108' y='145.0' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Dans beaucoup de villes, on interdit les voitures dans le centre.</text>
<rect x='24' y='188' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='228.0' r='22' fill='#2f4a22'/>
<text x='68' y='236.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>2</text>
<text x='108' y='237.0' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Les commerçants craignent de perdre des clients.</text>
<rect x='24' y='280' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='320.0' r='22' fill='#2f4a22'/>
<text x='68' y='328.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>3</text>
<text x='108' y='329.0' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Pourtant, les rues sans voitures attirent souvent plus de promeneurs.</text>
<rect x='24' y='372' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='412.0' r='22' fill='#2f4a22'/>
<text x='68' y='420.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>4</text>
<text x='108' y='421.0' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>À Gand, par exemple, l'air est devenu plus propre depuis 2017.</text>
<rect x='24' y='464' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='504.0' r='22' fill='#2f4a22'/>
<text x='68' y='512.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>5</text>
<text x='108' y='513.0' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>À mon avis, chaque ville devrait essayer cette idée.</text>
<rect x='24' y='556' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='596.0' r='22' fill='#2f4a22'/>
<text x='68' y='604.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>6</text>
<text x='108' y='605.0' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Bref, un centre sans voitures est bon pour tout le monde.</text>
</svg>