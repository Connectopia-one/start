<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Begeleider Ines geeft feedback aan Mo (10)</text>
<rect x="80" y="70" width="840" height="80" rx="26" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<path d="M 110 150 L 95 170 L 140 150" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<circle cx="130" cy="110" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="130" y="117" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="170" y="118" font-size="22" text-anchor="start" fill="#24331b">Daardoor moest de hele groep telkens opnieuw beginnen.</text>
<rect x="80" y="178" width="840" height="80" rx="26" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<path d="M 110 258 L 95 278 L 140 258" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<circle cx="130" cy="218" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="130" y="225" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="170" y="226" font-size="22" text-anchor="start" fill="#24331b">Je kwam vandaag drie keer te laat in de kring.</text>
<rect x="80" y="286" width="840" height="80" rx="26" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<path d="M 110 366 L 95 386 L 140 366" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<circle cx="130" cy="326" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="130" y="333" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="170" y="334" font-size="22" text-anchor="start" fill="#24331b">Jij bent echt onbetrouwbaar.</text>
<rect x="80" y="394" width="840" height="80" rx="26" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<path d="M 110 474 L 95 494 L 140 474" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<circle cx="130" cy="434" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="130" y="441" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="170" y="442" font-size="22" text-anchor="start" fill="#24331b">Ik zou graag hebben dat je om negen uur in de kring zit.</text>
<rect x="80" y="502" width="840" height="80" rx="26" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<path d="M 110 582 L 95 602 L 140 582" fill="#ffffff" stroke="#b5651d" stroke-width="3"/>
<circle cx="130" cy="542" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="130" y="549" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="170" y="550" font-size="22" text-anchor="start" fill="#24331b">Dat maakte me wat ongeduldig.</text>
</svg>
