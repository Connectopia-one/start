<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Observatieverslag, dinsdag, les wiskunde</text>
<rect x="60" y="60" width="880" height="540" rx="8" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<rect x="60" y="60" width="880" height="50" rx="8" fill="#e8c547" stroke="#24331b" stroke-width="3"/>
<text x="90" y="93" font-size="19" text-anchor="start" fill="#24331b">Leerling: Tim (11)  ·  Waarnemer: stagiair</text>
<circle cx="110" cy="168" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="110" y="175" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="150" y="175" font-size="21" text-anchor="start" fill="#24331b">Om 10.15 uur duwt Tim zijn stoel achteruit en gaat bij het raam staan.</text>
<circle cx="110" cy="256" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="110" y="263" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="150" y="263" font-size="21" text-anchor="start" fill="#24331b">Tim is vandaag weer eens lui.</text>
<circle cx="110" cy="344" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="110" y="351" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="150" y="351" font-size="21" text-anchor="start" fill="#24331b">Hij zegt twee keer: 'Ik snap het niet.'</text>
<circle cx="110" cy="432" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="110" y="439" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="150" y="439" font-size="21" text-anchor="start" fill="#24331b">Zoals altijd verpest Tim de les voor iedereen.</text>
<circle cx="110" cy="520" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="110" y="527" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="150" y="527" font-size="21" text-anchor="start" fill="#24331b">Na vijf minuten gaat hij terug zitten en neemt hij zijn pen.</text>
</svg>
