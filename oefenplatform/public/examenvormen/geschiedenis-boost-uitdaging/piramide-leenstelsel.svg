<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' width='1000' height='600'>
<rect width='1000' height='600' fill='#ffffff'/>
<text x='40' y='52' font-family='Nunito, Arial, sans-serif' font-size='28' font-weight='800' fill='#2f4a22'>Het leenstelsel in de middeleeuwen</text>
<polygon points='420.0,110 580.0,110 680.0,215 320.0,215' fill='#e9efe2' stroke='#b9b29c' stroke-width='2.5'/>
<circle cx='500' cy='142' r='20' fill='#2f4a22'/>
<text x='500' y='150' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>1</text>
<text x='500' y='190' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='19' fill='#2b2b2b'>geeft grote lenen</text>
<polygon points='320.0,215 680.0,215 780.0,320 220.0,320' fill='#f6ecd9' stroke='#b9b29c' stroke-width='2.5'/>
<circle cx='500' cy='247' r='20' fill='#2f4a22'/>
<text x='500' y='255' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>2</text>
<text x='500' y='295' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='19' fill='#2b2b2b'>krijgen een leen en geven zelf kleinere lenen</text>
<polygon points='220.0,320 780.0,320 880.0,425 120.0,425' fill='#e3ecf2' stroke='#b9b29c' stroke-width='2.5'/>
<circle cx='500' cy='352' r='20' fill='#2f4a22'/>
<text x='500' y='360' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>3</text>
<text x='500' y='400' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='19' fill='#2b2b2b'>krijgen een klein leen en vechten te paard</text>
<polygon points='120.0,425 880.0,425 980.0,530 20.0,530' fill='#f3e3e3' stroke='#b9b29c' stroke-width='2.5'/>
<circle cx='500' cy='457' r='20' fill='#2f4a22'/>
<text x='500' y='465' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>4</text>
<text x='500' y='505' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='19' fill='#2b2b2b'>bewerken het land en geven een deel van de oogst</text>
<text x='500' y='570' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='18' fill='#6b6b6b'>Hoe lager in de piramide, hoe meer mensen.</text>
</svg>