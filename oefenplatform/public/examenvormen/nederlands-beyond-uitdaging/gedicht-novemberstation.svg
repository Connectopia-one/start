<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 856' width='1000' height='856'>
<rect width='1000' height='856' fill='#ffffff'/>
<text x='40' y='58' font-family='Nunito, Arial, sans-serif' font-size='32' font-weight='800' fill='#2f4a22'>Novemberstation</text>
<rect x='24' y='96' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='136.0' r='22' fill='#2f4a22'/>
<text x='68' y='144.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>1</text>
<text x='108' y='145.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>De trein kreunt het perron op,</text>
<rect x='24' y='188' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='228.0' r='22' fill='#2f4a22'/>
<text x='68' y='236.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>2</text>
<text x='108' y='237.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>zijn ramen grijs van wat de nacht</text>
<rect x='24' y='280' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='320.0' r='22' fill='#2f4a22'/>
<text x='68' y='328.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>3</text>
<text x='108' y='329.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>nog niet wou loslaten.</text>
<rect x='24' y='372' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='412.0' r='22' fill='#2f4a22'/>
<text x='68' y='420.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>4</text>
<text x='108' y='421.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>Een man, zo stil als een koffer,</text>
<rect x='24' y='464' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='504.0' r='22' fill='#2f4a22'/>
<text x='68' y='512.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>5</text>
<text x='108' y='513.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>kijkt op de klok, en nog eens, en nog eens.</text>
<rect x='24' y='556' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='596.0' r='22' fill='#2f4a22'/>
<text x='68' y='604.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>6</text>
<text x='108' y='605.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>Het licht ruikt naar ijzer en koffie.</text>
<rect x='24' y='648' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='688.0' r='22' fill='#2f4a22'/>
<text x='68' y='696.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>7</text>
<text x='108' y='697.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>Wie vertrekt, laat iets achter;</text>
<rect x='24' y='740' width='952' height='80' rx='16' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<circle cx='68' cy='780.0' r='22' fill='#2f4a22'/>
<text x='68' y='788.0' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>8</text>
<text x='108' y='789.0' font-family='Nunito, Arial, sans-serif' font-size='23' font-style='italic' fill='#2b2b2b'>wie blijft, neemt alles mee.</text>
</svg>