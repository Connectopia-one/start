<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' width='1000' height='600'>
<rect width='1000' height='600' fill='#ffffff'/>
<text x='40' y='44' font-family='Nunito, Arial, sans-serif' font-size='28' font-weight='800' fill='#2f4a22'>Vier zinnen van een ouder tegen een tiener</text>
<rect x='40' y='80' width='440' height='170' rx='26' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<polygon points='100,248 110,280 140,248' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<line x1='102' y1='249' x2='138' y2='249' stroke='#f7f4ec' stroke-width='4'/>
<circle cx='74' cy='114' r='20' fill='#2f4a22'/>
<text x='74' y='121' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>1</text>
<text x='110' y='122' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Jij laat ook altijd je spullen</text>
<text x='110' y='154' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>rondslingeren, jij bent gewoon</text>
<text x='110' y='186' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>lui.</text>
<rect x='520' y='80' width='440' height='170' rx='26' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<polygon points='580,248 590,280 620,248' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<line x1='582' y1='249' x2='618' y2='249' stroke='#f7f4ec' stroke-width='4'/>
<circle cx='554' cy='114' r='20' fill='#2f4a22'/>
<text x='554' y='121' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>2</text>
<text x='590' y='122' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Als je jas op de grond ligt,</text>
<text x='590' y='154' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>struikel ik erover en dat</text>
<text x='590' y='186' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>maakt me boos.</text>
<rect x='40' y='330' width='440' height='170' rx='26' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<polygon points='100,498 110,530 140,498' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<line x1='102' y1='499' x2='138' y2='499' stroke='#f7f4ec' stroke-width='4'/>
<circle cx='74' cy='364' r='20' fill='#2f4a22'/>
<text x='74' y='371' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>3</text>
<text x='110' y='372' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Je bedoelt dus dat je na</text>
<text x='110' y='404' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>school eerst even rust nodig</text>
<text x='110' y='436' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>hebt?</text>
<rect x='520' y='330' width='440' height='170' rx='26' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<polygon points='580,498 590,530 620,498' fill='#f7f4ec' stroke='#b9b29c' stroke-width='2'/>
<line x1='582' y1='499' x2='618' y2='499' stroke='#f7f4ec' stroke-width='4'/>
<circle cx='554' cy='364' r='20' fill='#2f4a22'/>
<text x='554' y='371' text-anchor='middle' font-family='Nunito, Arial, sans-serif' font-size='22' font-weight='800' fill='#ffffff'>4</text>
<text x='590' y='372' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>Je ruimt nu meteen je kamer</text>
<text x='590' y='404' font-family='Nunito, Arial, sans-serif' font-size='22' fill='#2b2b2b'>op, anders mag je niet weg.</text>
</svg>