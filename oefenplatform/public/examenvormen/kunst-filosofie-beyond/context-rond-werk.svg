<text x="205" y="515" font-size="21" text-anchor="middle" fill="#24331b" font-weight="bold">politieke, sociale</text>
<text x="205" y="545" font-size="21" text-anchor="middle" fill="#24331b" font-weight="bold">en culturele context</text>
