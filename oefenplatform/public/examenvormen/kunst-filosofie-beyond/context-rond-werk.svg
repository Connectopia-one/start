<text x="70" y="107" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="205" y="150" font-size="21" text-anchor="middle" fill="#24331b" font-weight="bold">tijd</text>
<rect x="660" y="70" width="300" height="130" rx="12" fill="#fbfaf5" stroke="#24331b" stroke-width="3"/>
