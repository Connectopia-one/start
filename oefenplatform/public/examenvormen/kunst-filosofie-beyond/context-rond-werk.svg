<text x="500" y="330" font-size="28" text-anchor="middle" fill="#24331b" font-weight="bold">kunstwerk</text>
<rect x="40" y="70" width="300" height="130" rx="12" fill="#fbfaf5" stroke="#24331b" stroke-width="3"/>
