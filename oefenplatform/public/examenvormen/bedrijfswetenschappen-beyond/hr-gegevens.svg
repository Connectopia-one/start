<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" font-family="Arial, sans-serif">
<rect width="900" height="408" fill="#fffdf7"/>
<rect x="10" y="10" width="880" height="388" rx="16" fill="#fff" stroke="#b9b29c" stroke-width="2"/>
<text x="450.0" y="58" font-size="28" text-anchor="middle" fill="#24331b" font-weight="bold">Personeelsgegevens van drukkerij Inkt nv</text>
<rect x="24" y="90" width="852" height="48" fill="#eef3e6"/>
<text x="40" y="122" font-size="22" text-anchor="start" fill="#24331b">Gemiddeld aantal werknemers in 2026</text>
<text x="860" y="122" font-size="22" text-anchor="end" fill="#24331b">80</text>
<text x="40" y="170" font-size="22" text-anchor="start" fill="#24331b">Werknemers die in 2026 vertrokken</text>
<text x="860" y="170" font-size="22" text-anchor="end" fill="#24331b">12</text>
<rect x="24" y="186" width="852" height="48" fill="#eef3e6"/>
<text x="40" y="218" font-size="22" text-anchor="start" fill="#24331b">Nieuwe werknemers in 2026</text>
<text x="860" y="218" font-size="22" text-anchor="end" fill="#24331b">15</text>
<text x="40" y="266" font-size="22" text-anchor="start" fill="#24331b">Gemiddeld aantal zieke werknemers per werkdag</text>
<text x="860" y="266" font-size="22" text-anchor="end" fill="#24331b">4</text>
<rect x="24" y="282" width="852" height="48" fill="#eef3e6"/>
<text x="40" y="314" font-size="22" text-anchor="start" fill="#24331b">Opleidingsuren in 2026, alle werknemers samen</text>
<text x="860" y="314" font-size="22" text-anchor="end" fill="#24331b">1 200</text>
<text x="40" y="362" font-size="22" text-anchor="start" fill="#24331b">Werknemers tevreden of zeer tevreden (enquête)</text>
<text x="860" y="362" font-size="22" text-anchor="end" fill="#24331b">56</text>
</svg>
