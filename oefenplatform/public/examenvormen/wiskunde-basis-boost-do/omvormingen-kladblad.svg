<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#fffdf7"/>
<rect x="40.0" y="60.0" width="440.0" height="540.0" rx="12" fill="#ffffff" stroke="#b9b29c" stroke-width="2"/>
<text x="260.0" y="100.0" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Oefening 1</text>
<text x="260.0" y="150.0" font-size="21" text-anchor="middle" fill="#24331b">Maak v vrij in Eₖ = ½·m·v²</text>
<line x1="60.0" y1="275.0" x2="460.0" y2="275.0" stroke="#e7e2d2" stroke-width="1"/>
<circle cx="90" cy="250" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="90.0" y="257.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<text x="135.0" y="258.0" font-size="25" text-anchor="start" fill="#24331b">2·Eₖ = m·v²</text>
<line x1="60.0" y1="385.0" x2="460.0" y2="385.0" stroke="#e7e2d2" stroke-width="1"/>
<circle cx="90" cy="360" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="90.0" y="367.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<text x="135.0" y="368.0" font-size="25" text-anchor="start" fill="#24331b">v² = 2·Eₖ − m</text>
<line x1="60.0" y1="495.0" x2="460.0" y2="495.0" stroke="#e7e2d2" stroke-width="1"/>
<circle cx="90" cy="470" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="90.0" y="477.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<text x="135.0" y="478.0" font-size="25" text-anchor="start" fill="#24331b">v = √(2·Eₖ − m)</text>
<rect x="520.0" y="60.0" width="440.0" height="540.0" rx="12" fill="#ffffff" stroke="#b9b29c" stroke-width="2"/>
<text x="740.0" y="100.0" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Oefening 2</text>
<text x="740.0" y="150.0" font-size="21" text-anchor="middle" fill="#24331b">Maak b vrij in P = 2l + 2b</text>
<line x1="540.0" y1="275.0" x2="940.0" y2="275.0" stroke="#e7e2d2" stroke-width="1"/>
<circle cx="570" cy="250" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="570.0" y="257.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
<text x="615.0" y="258.0" font-size="25" text-anchor="start" fill="#24331b">P − 2l = 2b</text>
<line x1="540.0" y1="385.0" x2="940.0" y2="385.0" stroke="#e7e2d2" stroke-width="1"/>
<circle cx="570" cy="360" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="570.0" y="367.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">E</text>
<text x="615.0" y="368.0" font-size="25" text-anchor="start" fill="#24331b">(P − 2l) : 2 = b</text>
<line x1="540.0" y1="495.0" x2="940.0" y2="495.0" stroke="#e7e2d2" stroke-width="1"/>
<circle cx="570" cy="470" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="570.0" y="477.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">F</text>
<text x="615.0" y="478.0" font-size="25" text-anchor="start" fill="#24331b">b = P − l</text>
<text x="500.0" y="30.0" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">Twee leerlingen maken een letter vrij</text>
</svg>
