<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Een pagina uit een verzonnen regionale krant</text>
<rect x="70" y="50" width="860" height="560" rx="4" fill="#ffffff" stroke="#d9d4c4" stroke-width="2"/>
<text x="500" y="95" font-size="30" text-anchor="middle" fill="#24331b" font-weight="bold">De Kempische Bode</text>
<line x1="90" y1="112" x2="910" y2="112" stroke="#24331b" stroke-width="2"/>
<rect x="90" y="130" width="480" height="230" rx="0" fill="#ffffff" stroke="#d9d4c4" stroke-width="1"/>
<text x="105" y="165" font-size="22" text-anchor="start" fill="#24331b" font-weight="bold">Schepen gebruikte gemeentegeld</text>
<text x="105" y="192" font-size="22" text-anchor="start" fill="#24331b" font-weight="bold">voor eigen verbouwing</text>
<text x="105" y="225" font-size="16" text-anchor="start" fill="#5c6356">Onze redactie vond facturen die tonen dat ...</text>
<line x1="105" y1="255" x2="550" y2="255" stroke="#d8d6cc" stroke-width="6"/>
<line x1="105" y1="280" x2="550" y2="280" stroke="#d8d6cc" stroke-width="6"/>
<line x1="105" y1="305" x2="550" y2="305" stroke="#d8d6cc" stroke-width="6"/>
<line x1="105" y1="330" x2="550" y2="330" stroke="#d8d6cc" stroke-width="6"/>
<circle cx="540" cy="165" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="540" y="172" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<rect x="590" y="130" width="320" height="230" rx="0" fill="#f4f4f2" stroke="#d9d4c4" stroke-width="1"/>
<text x="605" y="165" font-size="20" text-anchor="start" fill="#24331b" font-weight="bold">Onze mening</text>
<text x="605" y="192" font-size="18" text-anchor="start" fill="#24331b">Het is tijd voor openheid</text>
<line x1="605" y1="225" x2="890" y2="225" stroke="#d8d6cc" stroke-width="6"/>
<line x1="605" y1="250" x2="890" y2="250" stroke="#d8d6cc" stroke-width="6"/>
<line x1="605" y1="275" x2="890" y2="275" stroke="#d8d6cc" stroke-width="6"/>
<line x1="605" y1="300" x2="890" y2="300" stroke="#d8d6cc" stroke-width="6"/>
<line x1="605" y1="325" x2="890" y2="325" stroke="#d8d6cc" stroke-width="6"/>
<circle cx="880" cy="165" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="880" y="172" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<rect x="90" y="380" width="480" height="210" rx="0" fill="#ffffff" stroke="#d9d4c4" stroke-width="1"/>
<text x="105" y="415" font-size="20" text-anchor="start" fill="#24331b" font-weight="bold">Bewoners van de Lindewijk:</text>
<text x="105" y="442" font-size="20" text-anchor="start" fill="#24331b" font-weight="bold">“Wij worden niet gehoord”</text>
<text x="105" y="475" font-size="16" text-anchor="start" fill="#5c6356">“Al twee jaar geen speelplein,” zegt een moeder.</text>
<line x1="105" y1="505" x2="550" y2="505" stroke="#d8d6cc" stroke-width="6"/>
<line x1="105" y1="530" x2="550" y2="530" stroke="#d8d6cc" stroke-width="6"/>
<line x1="105" y1="555" x2="550" y2="555" stroke="#d8d6cc" stroke-width="6"/>
<circle cx="540" cy="415" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="540" y="422" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<rect x="590" y="380" width="320" height="210" rx="8" fill="#e8efe1" stroke="#24331b" stroke-width="2"/>
<text x="750" y="430" font-size="26" text-anchor="middle" fill="#24331b" font-weight="bold">Nieuwe fiets?</text>
<text x="750" y="475" font-size="22" text-anchor="middle" fill="#24331b">Nu 20 % korting</text>
<text x="750" y="510" font-size="18" text-anchor="middle" fill="#5c6356">bij Fietsen Peeters</text>
<circle cx="880" cy="560" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="880" y="567" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
</svg>
