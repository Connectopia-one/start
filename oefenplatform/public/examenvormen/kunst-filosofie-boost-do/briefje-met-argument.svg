<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Een briefje over gsm's in de klas</text>
<rect x="80" y="60" width="840" height="560" rx="10" fill="#fffdf5" stroke="#24331b" stroke-width="3"/>
<rect x="110" y="85" width="780" height="110" rx="8" fill="#ffffff" stroke="#8a8470" stroke-width="2"/>
<text x="190" y="135" font-size="22" text-anchor="start" fill="#24331b">Stel je voor: je zit midden in een moeilijke toets</text>
<text x="190" y="167" font-size="22" text-anchor="start" fill="#24331b">en een gsm trilt drie keer op de bank naast je.</text>
<circle cx="150" cy="140" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="150" y="147" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">1</text>
<rect x="110" y="215" width="780" height="110" rx="8" fill="#ffffff" stroke="#8a8470" stroke-width="2"/>
<text x="190" y="265" font-size="22" text-anchor="start" fill="#24331b">Mijn argument is dat gsm's tijdens de les</text>
<text x="190" y="297" font-size="22" text-anchor="start" fill="#24331b">beter in de kast blijven.</text>
<circle cx="150" cy="270" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="150" y="277" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">2</text>
<rect x="110" y="345" width="780" height="110" rx="8" fill="#ffffff" stroke="#8a8470" stroke-width="2"/>
<text x="190" y="395" font-size="22" text-anchor="start" fill="#24331b">Iedereen weet dat. Het is gewoon zo.</text>
<circle cx="150" cy="400" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="150" y="407" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">3</text>
<rect x="110" y="475" width="780" height="110" rx="8" fill="#ffffff" stroke="#8a8470" stroke-width="2"/>
<text x="190" y="525" font-size="22" text-anchor="start" fill="#24331b">Want een melding trekt je aandacht weg,</text>
<text x="190" y="557" font-size="22" text-anchor="start" fill="#24331b">en wie zich niet kan concentreren, leert minder.</text>
<circle cx="150" cy="530" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="150" y="537" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">4</text>
</svg>
