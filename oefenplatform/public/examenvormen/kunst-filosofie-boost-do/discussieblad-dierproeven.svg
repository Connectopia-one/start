<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" text-anchor="middle" fill="#24331b" font-weight="bold">Een discussieblad over dierproeven</text>
<rect x="60" y="80" width="420" height="210" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<text x="260" y="150" font-size="23" text-anchor="middle" fill="#24331b">Het leed van de dieren</text>
<text x="260" y="184" font-size="23" text-anchor="middle" fill="#24331b">weegt zwaarder dan</text>
<text x="260" y="218" font-size="23" text-anchor="middle" fill="#24331b">wat de proef oplevert.</text>
<circle cx="450" cy="260" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="450" y="267" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">A</text>
<rect x="520" y="80" width="420" height="210" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<text x="720" y="150" font-size="23" text-anchor="middle" fill="#24331b">Een dier mag nooit</text>
<text x="720" y="184" font-size="23" text-anchor="middle" fill="#24331b">louter een middel zijn,</text>
<text x="720" y="218" font-size="23" text-anchor="middle" fill="#24331b">wat het ook opbrengt.</text>
<circle cx="910" cy="260" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="910" y="267" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">B</text>
<rect x="60" y="350" width="420" height="210" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<text x="260" y="420" font-size="23" text-anchor="middle" fill="#24331b">Iedereen in mijn</text>
<text x="260" y="454" font-size="23" text-anchor="middle" fill="#24331b">klas is ertegen,</text>
<text x="260" y="488" font-size="23" text-anchor="middle" fill="#24331b">dus het is fout.</text>
<circle cx="450" cy="530" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="450" y="537" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">C</text>
<rect x="520" y="350" width="420" height="210" rx="30" fill="#ffffff" stroke="#24331b" stroke-width="3"/>
<text x="720" y="420" font-size="23" text-anchor="middle" fill="#24331b">Wie onderzoek doet,</text>
<text x="720" y="454" font-size="23" text-anchor="middle" fill="#24331b">moet vrij kunnen kiezen</text>
<text x="720" y="488" font-size="23" text-anchor="middle" fill="#24331b">hoe hij werkt.</text>
<circle cx="910" cy="530" r="20" fill="#ffffff" stroke="#24331b" stroke-width="2"/>
<text x="910" y="537" font-size="20" text-anchor="middle" fill="#24331b" font-weight="bold">D</text>
</svg>
